<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>함박꽃북토리 교무수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
/* Layout: 한 장짜리 업무 앱. 위 머리띠(학교·날짜·D-day) → 탭 → 탭별 2단(본문 + 옆 카드). 꽃잎색 강조 + 잎색 보조. */
:root{
  --bg:#fbf8f9; --paper:#ffffff; --sunk:#f5eff2; --line:#ebe1e5; --line2:#dcd0d5;
  --fg:#2b2328; --fg2:#6d6168; --fg3:#9a8d94;
  --accent:#c94a72; --accent-ink:#ffffff; --accent-soft:#fbe6ee; --accent-deep:#9b2f53;
  --leaf:#3f7d58; --leaf-soft:#e3f0e7;
  --warn:#c9822a; --warn-soft:#fbf0de; --danger:#c43d3d;
  --shadow:0 1px 2px rgba(80,40,55,.06),0 6px 18px rgba(80,40,55,.06);
  --f-display:"Sunflower","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1619; --paper:#251e22; --sunk:#2d2529; --line:#3a3036; --line2:#4a3e45;
  --fg:#f1e9ed; --fg2:#bfb1b8; --fg3:#8f8189;
  --accent-ink:#1b1619; --accent-soft:#40252f; --accent-deep:#f2a7bf;
  --leaf:#7cc296; --leaf-soft:#22342a; --warn:#e2a95d; --warn-soft:#3a2e1d; --danger:#ef7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1619; --paper:#251e22; --sunk:#2d2529; --line:#3a3036; --line2:#4a3e45;
  --fg:#f1e9ed; --fg2:#bfb1b8; --fg3:#8f8189;
  --accent-ink:#1b1619; --accent-soft:#40252f; --accent-deep:#f2a7bf;
  --leaf:#7cc296; --leaf-soft:#22342a; --warn:#e2a95d; --warn-soft:#3a2e1d; --danger:#ef7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
/* 테마 색 */
body[data-c="green"]{--accent:#3f8a5c;--accent-deep:#2c6542;--accent-soft:#e1f1e7}
body[data-c="blue"]{--accent:#3a74c4;--accent-deep:#285594;--accent-soft:#e2ecf9}
body[data-c="purple"]{--accent:#7d57c2;--accent-deep:#5c3d96;--accent-soft:#ece5f8}
body[data-c="orange"]{--accent:#d8722c;--accent-deep:#a5531b;--accent-soft:#fbeadc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--accent:#e2799a}
 :root:not([data-theme="light"]) body[data-c="green"]{--accent:#6cbf8c;--accent-soft:#213a2b;--accent-deep:#a6dfbb}
 :root:not([data-theme="light"]) body[data-c="blue"]{--accent:#76a5e6;--accent-soft:#1f2c40;--accent-deep:#b3cdf2}
 :root:not([data-theme="light"]) body[data-c="purple"]{--accent:#a98be0;--accent-soft:#2c2340;--accent-deep:#cfbdf2}
 :root:not([data-theme="light"]) body[data-c="orange"]{--accent:#eb9a5f;--accent-soft:#3a281b;--accent-deep:#f5c8a5}}
:root[data-theme="dark"] body{--accent:#e2799a}
:root[data-theme="dark"] body[data-c="green"]{--accent:#6cbf8c;--accent-soft:#213a2b;--accent-deep:#a6dfbb}
:root[data-theme="dark"] body[data-c="blue"]{--accent:#76a5e6;--accent-soft:#1f2c40;--accent-deep:#b3cdf2}
:root[data-theme="dark"] body[data-c="purple"]{--accent:#a98be0;--accent-soft:#2c2340;--accent-deep:#cfbdf2}
:root[data-theme="dark"] body[data-c="orange"]{--accent:#eb9a5f;--accent-soft:#3a281b;--accent-deep:#f5c8a5}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)} .faint{color:var(--fg3)} .small{font-size:12px}

/* 머리띠 */
.top{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 22px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 30%,transparent 31%),
  conic-gradient(from 0deg,rgba(255,255,255,.12) 0 12%,transparent 12% 20%,rgba(255,255,255,.12) 20% 32%,transparent 32% 40%,rgba(255,255,255,.12) 40% 52%,transparent 52% 60%,rgba(255,255,255,.12) 60% 72%,transparent 72% 80%,rgba(255,255,255,.12) 80% 92%,transparent 92%);pointer-events:none}
.top .who{font-size:13px;opacity:.9}
.top h1{font-size:clamp(22px,3.2vw,30px);line-height:1.15;margin-top:2px;word-break:keep-all}
.top .yearsel{margin-top:8px;display:inline-flex;white-space:nowrap;flex:none;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 4px 2px 12px;font-size:13px}
.top .yearsel select{background:transparent;border:0;font-weight:700;color:inherit;padding:4px}
.top .yearsel option{color:#2b2328}
.top .today{position:relative;z-index:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.top .datebox{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;line-height:1.35}
.top .datebox b{font-size:16px}
.top .dday{font-family:var(--f-display);font-size:18px;color:#fff6c9}
.gear{background:rgba(255,255,255,.2);border:0;border-radius:999px;padding:6px 12px;color:inherit;font-size:13px}

/* 탭 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin-block:-8px}
.bnav{display:none}
@media (min-width:1100px){
  .wrap{display:grid;grid-template-columns:172px minmax(0,1fr);gap:16px;align-items:start;max-width:1420px}
  .wrap>.top,.wrap>.notice,.wrap>.save{grid-column:1/-1}
  .wrap>.tabs{grid-column:1;flex-direction:column;flex-wrap:nowrap;gap:2px;position:sticky;top:12px;margin:0;padding:10px 8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow-y:auto}
  .wrap>.tabs::before{content:"탭 바로가기";font-size:11px;color:var(--fg3);padding:2px 8px 6px;letter-spacing:.04em}
  .wrap>.tabs .tab{width:100%;border:0;background:transparent;box-shadow:none;padding:7px 10px 7px 8px;border-radius:999px;text-align:left}
  .wrap>.tabs .tab:hover{background:var(--sunk)}
  .wrap>.tabs .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .wrap>main{grid-column:2;min-width:0}
}
.seg.seg2{background:transparent;padding:0;gap:6px}.seg.seg2 button{border:1px solid var(--line);padding:4px 12px;font-size:13px}.seg.seg2 button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:none}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px 7px 8px;display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:var(--shadow)}
.tab i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sunk);color:var(--fg2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] i{background:rgba(255,255,255,.9);color:var(--accent-deep)}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px}

/* 패널 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:18px;display:flex;align-items:center;gap:8px}
.panel h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){.grid-3{grid-template-columns:minmax(0,1fr)}.grid-main{grid-template-columns:minmax(0,1fr)}}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--accent-deep);font-weight:700;box-shadow:var(--shadow)}

.btn{border:0;border-radius:999px;padding:7px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--fg2);font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line2)}
.btn.sm{padding:4px 10px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--fg2);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:2px}
input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{
  border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.sec-label{font-size:12px;color:var(--fg3);letter-spacing:.06em;margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{color:var(--fg3);font-size:13px;padding:10px 2px}

/* 체크 줄 */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--sunk);border-radius:10px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin-top:1px;flex:none}
.chk .t{flex:1;min-width:0;overflow-wrap:anywhere}
.chk.done .t{text-decoration:line-through;color:var(--fg3)}
.chk .x{border:0;background:none;color:var(--fg3);font-size:16px;line-height:1;padding:0 2px}
.list{display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--sunk);color:var(--fg2);border:1px solid var(--line)}
.chip.on{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.chip.todo{background:var(--paper)}
button.chip{cursor:pointer}

/* 업무일지 */
.daynav{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.daynav h2{font-size:24px}
.circbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--sunk);font-size:16px;color:var(--fg2)}
.dday-big{font-family:var(--f-display);font-size:24px;color:var(--accent)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:18px;margin-top:12px}
@media (max-width:700px){.jgrid{grid-template-columns:minmax(0,1fr)}}
.cap{font-size:11px;letter-spacing:.12em;color:var(--fg3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.task{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);min-height:40px}
.task[draggable="true"]{cursor:grab}
.cat{border:0;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;flex:none;min-width:42px}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.s-done .t{text-decoration:line-through;color:var(--fg3)}
.task.s-cancel .t{text-decoration:line-through;color:var(--fg3);opacity:.6}
.task.s-defer .t{color:var(--fg3)}
.task .when{font-size:11px;color:var(--fg3)}
.stat{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);flex:none;font-size:13px;line-height:1;display:grid;place-items:center}
.stat.done{border-color:var(--leaf);color:var(--leaf)}
.stat.defer{border-color:var(--accent);color:var(--accent)}
.stat.cancel{color:var(--fg3)}
.statmenu{display:flex;gap:4px;flex:none}
.statmenu button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);font-size:12px}
.tadd{display:flex;gap:6px;margin-top:8px}
.tadd select{width:auto;flex:none}
.tadd input{flex:1}
.tt{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--paper);user-select:none}
.tt .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--fg3)}
.tt .hr span{position:absolute;left:6px;top:-1px;transform:translateY(-50%);background:var(--paper);padding:0 3px}
.tt .half{position:absolute;left:38px;right:0;border-top:1px dashed var(--line)}
.tt .bg{position:absolute;left:38px;right:6px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);border:1px dashed var(--line2);font-size:11px;color:var(--fg3);padding:2px 6px;overflow:hidden;pointer-events:none}
.tt .blk{position:absolute;left:44px;right:8px;border-radius:8px;padding:3px 8px;font-size:12px;overflow:hidden;cursor:grab;border:1px solid transparent;display:flex;justify-content:space-between;gap:4px}
.tt .blk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tt .blk .tm{font-size:10px;opacity:.75;white-space:nowrap}
.tt .blk .grip{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.tt .blk .rm{border:0;background:none;padding:0 2px;font-size:13px;line-height:1;opacity:.6;color:inherit}
.tt.drop{outline:2px dashed var(--accent);outline-offset:2px}
.tt .now{position:absolute;left:34px;right:0;border-top:2px solid var(--accent);pointer-events:none}
.tt .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.strip button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 0;width:40px;line-height:1.2;font-size:13px}
.strip button small{display:block;font-size:10px;color:var(--fg3)}
.strip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strip button[aria-pressed="true"] small{color:inherit}
.strip button.today{border-color:var(--accent)}
.months{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.months button{flex:none;border:0;background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg2)}
.months button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pick{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sunk);border-radius:10px;border:0;width:100%;text-align:left}
.pick .plus{margin-left:auto;color:var(--accent);font-weight:700}

/* 홈 카드 */
.evline{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.evline b{font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap}

/* 캘린더 */
.cal{display:flex;flex-direction:column;gap:6px}
.calhead{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;color:var(--fg3)}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:auto;column-gap:4px;row-gap:3px;position:relative;padding:4px;background:var(--sunk);border-radius:12px}
.wk .cell{background:var(--paper);border-radius:9px;border:1px solid transparent;cursor:pointer;min-height:96px;z-index:0}
.wk .cell.out{opacity:.45}
.wk .cell.today{border-color:var(--accent)}
.wk .cell.vac{background:repeating-linear-gradient(135deg,var(--paper) 0 8px,var(--sunk) 8px 9px)}
.wk .dn{z-index:1;padding:4px 8px 0;font-weight:700;font-size:13px;pointer-events:none;display:flex;gap:6px;align-items:baseline}
.wk .dn .hol{font-size:10px;color:var(--danger);font-weight:500}
.wk .bar{z-index:2;margin:0 3px;border-radius:6px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;padding:2px 14px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:center}
.wk .bar.sys{background:var(--leaf-soft);color:var(--leaf);cursor:default}
.wk .bar .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.wk .bar .h::after{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:2px;border-radius:2px;background:currentColor;opacity:.4}
.wk .bar .h.l{left:0}.wk .bar .h.r{right:0}
.wk .items{z-index:1;display:flex;flex-direction:column;gap:3px;padding:0 4px 6px;pointer-events:none;min-width:0}
.it{pointer-events:auto;font-size:12px;border-radius:6px;padding:2px 6px;background:var(--sunk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:0;text-align:left;width:100%}
.it.day{background:var(--warn-soft);color:var(--fg)}
.it.promo{background:var(--accent-soft);color:var(--accent-deep)}
.it.memo{background:transparent;border:1px dashed var(--line2);color:var(--fg2)}
.it small{display:block;font-size:10px;opacity:.75}
@media (max-width:640px){.wk .cell{min-height:70px}.wk .dn{font-size:12px;padding:3px 5px 0}.it{font-size:11px;padding:1px 4px}.wk .bar{font-size:11px;padding:1px 10px}}

/* 행사 카드 */
.mon{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.monhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monhead h3{font-size:20px}
.monhead .sum{margin-left:auto;font-size:12px;color:var(--fg3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ecard{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.poster{aspect-ratio:3/4;max-width:100%;width:100%;object-fit:cover;display:block;background:var(--sunk)}
.ph{aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:
  radial-gradient(circle at 85% 12%,var(--accent-soft) 0 22%,transparent 23%),
  radial-gradient(circle at 10% 92%,var(--leaf-soft) 0 26%,transparent 27%),var(--sunk)}
.ph .k{font-size:11px;color:var(--fg3);letter-spacing:.08em}

const store={mode:"loading",db:null,uid:null,assets:null,downloads:null,timers:{},dirty:{}};

/* Ctrl+Z 되돌리기: 저장이 일어날 때마다 직전 상태를 쌓아 두고(최대 40번), 되돌리면 그 상태로 돌아간다. 이 창을 열어 둔 동안만 기억한다. */
const hist={undo:[],redo:[],last:null,mute:0,t:0};
function histSnap(){return{core:JSON.stringify(core),j:Object.fromEntries(Object.entries(journals).map(([k,v])=>[k,JSON.stringify(v)]))}}
function histSame(a,b){return a.core===b.core&&Object.keys(a.j).every(k=>b.j[k]===undefined||a.j[k]===b.j[k])}
function histCommit(){clearTimeout(hist.t);hist.t=0;const cur=histSnap();if(Date.now()<hist.mute||!hist.last){hist.last=cur;return}if(histSame(hist.last,cur)){hist.last=cur;return}
  hist.undo.push(hist.last);if(hist.undo.length>40)hist.undo.shift();hist.redo=[];hist.last=cur;histBtn()}
function histRecord(){clearTimeout(hist.t);hist.t=setTimeout(histCommit,500)}
function histReset(){clearTimeout(hist.t);hist.undo=[];hist.redo=[];hist.last=null;setTimeout(()=>{hist.last=histSnap();histBtn()},700)}
function histBtn(){const b=$("#openUndo");if(b){b.disabled=!hist.undo.length;b.style.opacity=hist.undo.length?"1":".45"}}
function histApply(snap){hist.mute=Date.now()+1000;mergeCore(JSON.parse(snap.core));persist("core");
  Object.keys(snap.j).forEach(k=>{if(JSON.stringify(journals[k])!==snap.j[k]){journals[k]=JSON.parse(snap.j[k]);persist("j-"+k)}});
  closeModal();render();setTimeout(()=>{hist.last=histSnap();histBtn()},900)}
function histUndo(){if(hist.t)histCommit();if(!hist.undo.length){toast("되돌릴 게 없어요");return}hist.redo.push(histSnap());histApply(hist.undo.pop());histToast("되돌렸어요",true)}
function histRedo(){if(hist.t)histCommit();if(!hist.redo.length){toast("다시 실행할 게 없어요");return}hist.undo.push(histSnap());histApply(hist.redo.pop());histToast("다시 실행했어요",false)}
function histToast(msg,redo){$$(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast undo";d.innerHTML=`${msg} <span style="opacity:.7;font-size:12px">남은 되돌리기 ${hist.undo.length}번</span>${redo?` <button type="button" class="undobtn">다시 실행</button>`:""}`;document.body.appendChild(d);
  const b=$(".undobtn",d);if(b)b.addEventListener("click",()=>{d.remove();histRedo()});setTimeout(()=>d.remove(),4000)}
document.addEventListener("keydown",e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();if(k!=="z"&&k!=="y")return;
  const a=document.activeElement;if(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable))return;if($("#modalRoot").innerHTML)return;
  e.preventDefault();if(k==="y"||e.shiftKey)histRedo();else histUndo()});
function persist(name){
  histRecord();
  store.memoVer=(store.memoVer||0)+1;
  if(name==="core"&&!store.resyncing){clearTimeout(store.resyncT);store.resyncT=setTimeout(()=>resyncAuto(),400)}
  if(name==="core"){clearTimeout(store.pubT);store.pubT=setTimeout(()=>pubSync().catch(e=>console.warn("공개 실패",e)),2500)}
  store.dirty[name]=true; setSave("저장 중…");
  clearTimeout(store.timers[name]);
  store.timers[name]=setTimeout(()=>flush(name),700);
}
const writing={};
/* 저장 실패는 화면 위에 계속 보이게 하고, 다시 저장할 수 있게 한다 */
function saveFailed(name,msg,e){setSave("저장 안 됨");let b=$("#saveErr");if(!b){b=document.createElement("div");b.id="saveErr";b.className="saveerr";b.setAttribute("role","alert");$(".wrap").insertBefore(b,$("#tabs"))}
  b.innerHTML=`<b>⚠ 저장하지 못한 내용이 있어요.</b> <span>${esc(msg)}</span> <button type="button" class="btn sm" id="retrySave">다시 저장</button>`;
  $("#retrySave",b).onclick=()=>{Object.keys(store.dirty).filter(k=>store.dirty[k]).forEach(k=>flush(k))};console.warn("save failed",name,e)}
function clearSaveError(){const b=$("#saveErr");if(b)b.remove()}
window.addEventListener("beforeunload",e=>{if(Object.values(store.dirty).some(Boolean)){Object.keys(store.timers).forEach(k=>{clearTimeout(store.timers[k]);flush(k)});e.preventDefault();e.returnValue=""}});
/* ===== 나눠 저장하기 =====
   계정 저장 한 묶음의 한도(약 256KB)를 넘지 않도록 core를 여러 문서로 나눈다.
   core(설정 등) · p-notes(메모·정보함·학교·도서목록) · p-shop · p-lessons(차시 기록 뺀 수업)
   · p-logs-학년도(차시 기록) · p-ev-학년도(행사·홍보물·월간 프로그램) · p-bud-학년도(예산)
   바뀐 문서만 저장하고, 예전 한 묶음 형식은 첫 저장 때 자동으로 옮긴다. */
const NOTES_KEYS=["monthTodos","yearly","calMemos","yearMemos","freeMemo","booklists","info","school","reviewManual"];
const SPLIT_KEYS=["xcal","events","pmonths","promos","lessons","shop","budget","trash",...NOTES_KEYS];
function pruneAutoSent(c){const out={};const evIds=new Set(c.events.map(e=>e.id));const cut=ymd(addD(TODAY,-45));const mcut=ym(new Date(TODAY.getFullYear(),TODAY.getMonth()-2,1));
  Object.entries(c.autoSent||{}).forEach(([k,v])=>{if(k.startsWith("P:")){if(k.split(":")[2]>=mcut)out[k]=v;return}const e=c.events.find(x=>x.id===k.split(":")[0]);if(e&&evRange(e)[1]>=cut)out[k]=v;else if(!evIds.has(k.split(":")[0])&&v>=cut)out[k]=v});return out}
function splitCore(c){
  const cd={};Object.keys(c).forEach(k=>{if(!SPLIT_KEYS.includes(k))cd[k]=c[k]});cd.v=2;cd.autoSent=pruneAutoSent(c);
  const parts={};const evp=a=>parts["p-ev-"+a]=parts["p-ev-"+a]||{events:[],promos:[],pmonths:{}};
  parts["p-notes"]=Object.fromEntries(NOTES_KEYS.map(k=>[k,c[k]]));parts["p-notes"].budgetHistory=(c.budget||{}).history||[];
  parts["p-shop"]=c.shop;
  if(c.xcal||(c.parts||[]).includes("p-xcal"))parts["p-xcal"]={xcal:c.xcal||{}};
  if((c.trash||[]).length||(c.parts||[]).includes("p-trash"))parts["p-trash"]={trash:c.trash||[]};
  const {logs,...les}=c.lessons||{};parts["p-lessons"]=les;
  Object.entries(logs||{}).forEach(([k,l])=>{const a=ayOf(P(k.split("|")[0]));(parts["p-logs-"+a]=parts["p-logs-"+a]||{logs:{}}).logs[k]=l});
  (c.events||[]).forEach(e=>evp(ayOf(P(evRange(e)[0]))).events.push(e));
  (c.promos||[]).forEach(p=>evp(p.date?ayOf(P(p.date)):ayOf(TODAY)).promos.push(p));
  Object.entries(c.pmonths||{}).forEach(([pid,mm])=>Object.entries(mm||{}).forEach(([mk,x])=>{const E=evp(ayOf(P(mk+"-01")));(E.pmonths[pid]=E.pmonths[pid]||{})[mk]=x}));
  Object.entries((c.budget||{}).years||{}).forEach(([y,v])=>parts["p-bud-"+y]=v);
  return{cd,parts};
}
function joinCore(cd,docs){
  const d={...cd};d.events=[];d.promos=[];d.pmonths={};d.budget={years:{},history:[]};let les={},logs={};
  Object.entries(docs).forEach(([n,o])=>{if(!o)return;
    if(n==="p-notes"){NOTES_KEYS.forEach(k=>{if(o[k]!==undefined)d[k]=o[k]});d.budget.history=o.budgetHistory||[]}
    else if(n==="p-shop")d.shop=o;
    else if(n==="p-xcal")d.xcal=o.xcal||{};
    else if(n==="p-trash")d.trash=o.trash||[];
    else if(n==="p-lessons")les=o;
    else if(n.startsWith("p-logs-"))Object.assign(logs,o.logs||{});
    else if(n.startsWith("p-ev-")){d.events.push(...(o.events||[]));d.promos.push(...(o.promos||[]));Object.entries(o.pmonths||{}).forEach(([pid,mm])=>{d.pmonths[pid]=Object.assign(d.pmonths[pid]||{},mm)})}
    else if(n.startsWith("p-bud-")&&o.ops)d.budget.years[n.slice(6)]=o;});
  d.lessons={...les,logs};delete d.parts;return d;
}
function emptyPart(n){return n.startsWith("p-ev-")?{events:[],promos:[],pmonths:{}}:n.startsWith("p-logs-")?{logs:{}}:{}}
store.lastJSON={};store.partNames=[];
async function flushSplit(){
  const {cd,parts}=splitCore(core);
  const names=new Set([...store.partNames,...Object.keys(parts)]);names.forEach(n=>{if(!parts[n])parts[n]=emptyPart(n)});
  const big=[];const writes=[];
  names.forEach(n=>{const j=JSON.stringify(parts[n]);if(j.length>240000)big.push(n);if(j!==store.lastJSON[n])writes.push([n,j])});
  if(big.length)console.warn("큰 저장 묶음",big);
  await Promise.all(writes.map(([n,j])=>docRef(n).set(JSON.parse(j)).then(()=>{store.lastJSON[n]=j})));
  cd.parts=[...names].sort();store.partNames=cd.parts;
  const cj=JSON.stringify(cd);if(cj!==store.lastJSON.core){await docRef("core").set(JSON.parse(cj));store.lastJSON.core=cj}
  core.autoSent=cd.autoSent;watchParts();
  if(store.remoteNewer){store.remoteNewer=false;setTimeout(()=>{if(!store.dirty.core)scheduleRemoteReload()},50)}
  if(big.length)saveFailed("core","저장 묶음 하나가 한도에 가까워요. 설정 → 백업에서 파일로 받아 두고 알려 주세요.",new Error(big.join(",")));
}
/* 계정에서 불러오기: 새 형식이면 나눈 문서를 모아 합치고, 예전 형식이면 그대로 읽은 뒤 저장 때 옮긴다 */
async function loadSplit(data){
  if(data&&data.v===2&&Array.isArray(data.parts)){
    const snaps=await Promise.all(data.parts.map(n=>docRef(n).get().then(s=>[n,s.exists?JSON.parse(JSON.stringify(s.data())):null]).catch(()=>[n,null])));
    const docs={};snaps.forEach(([n,o])=>{docs[n]=o;if(o)store.lastJSON[n]=JSON.stringify(o)});
    store.partNames=data.parts.slice();store.lastJSON.core=JSON.stringify(data);
    mergeCore(joinCore(data,docs));watchParts();return false;
  }
  mergeCore(data);return !!data;   // 예전 형식이면 true → 바로 새 형식으로 옮겨 저장
}
const watched=new Set();
function watchParts(){store.partNames.forEach(n=>{if(watched.has(n))return;watched.add(n);
  docRef(n).onSnapshot(sn=>{if(sn.metadata&&sn.metadata.hasPendingWrites)return;const j=sn.exists?JSON.stringify(sn.data()):null;if(j===null||j===store.lastJSON[n])return;
    if(store.dirty.core||writing.core){store.remoteNewer=true;return}
    store.lastJSON[n]=j;scheduleRemoteReload()},()=>{})})}
function scheduleRemoteReload(){clearTimeout(store.rrT);store.rrT=setTimeout(async()=>{if(store.dirty.core||writing.core)return;
  try{const s=await docRef("core").get();if(s.exists){await loadSplit(JSON.parse(JSON.stringify(s.data())));if(!$("#modalRoot").innerHTML)render();histReset();setSave("다른 기기에서 바꾼 내용을 반영했어요")}}catch(e){}},400)}
async function flush(name){
  const body=name==="core"?core:journals[name.slice(2)];
  if(!body)return;
  if(store.mode==="db"){
    if(writing[name]){store.timers[name]=setTimeout(()=>flush(name),500);return}
    writing[name]=true;
    try{if(name==="core")await withTimeout(flushSplit(),20000);else await withTimeout(docRef(name).set(JSON.parse(JSON.stringify(body))),20000);store.dirty[name]=false;offDone(name);setSave("계정에 저장됨 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))}
    catch(e){offKeep(name);offRetry(name);saveFailed(name,navigator.onLine===false?"인터넷이 끊겼어요. 적은 내용은 이 기기에 임시로 보관했고, 연결되면 자동으로 계정에 저장해요.":"계정에 저장하지 못했어요. 이 기기에 임시로 보관했고 30초마다 다시 저장해 볼게요.",e)}
    writing[name]=false;if(!Object.values(store.dirty).some(Boolean))clearSaveError();
  }else{
    try{localStorage.setItem("hb-"+name,JSON.stringify(body));store.dirty[name]=false;setSave("이 브라우저에 저장됨");if(!Object.values(store.dirty).some(Boolean))clearSaveError()}
    catch(e){saveFailed(name,/quota/i.test(e.name+e.message)?"브라우저 저장 공간이 가득 찼어요. 설정 → 백업에서 파일로 내려받아 두세요.":"이 브라우저에 저장하지 못했어요. 설정 → 백업에서 파일로 내려받아 두세요.",e)}
  }
}
function mergeCore(d){const f=freshCore();d=d||{};core=Object.assign(f,d);core.settings=Object.assign(f.settings,d.settings||{});core.settings.tabs=Object.assign({lesson:true,shop:true,budget:true,school:true,info:true},core.settings.tabs||{});core.lessons=Object.assign(freshCore().lessons,d.lessons||{});core.shop=Object.assign(freshCore().shop,d.shop||{});core.budget=Object.assign(freshCore().budget,d.budget||{});core.school=Object.assign(freshCore().school,d.school||{});core.info=Object.assign(freshCore().info,d.info||{});core.booklists=Object.assign(freshCore().booklists,d.booklists||{});core.info.rule=Object.assign(freshCore().info.rule,core.info.rule||{})}
async function loadJournal(month){
  if(journals[month])return journals[month];
  journals[month]={days:{}};
  if(store.mode==="db"){try{const s=await docRef("j-"+month).get();if(s.exists)journals[month]=Object.assign({days:{}},s.data()&&JSON.parse(JSON.stringify(s.data())))}catch(e){}}
  else{try{const s=JSON.parse(localStorage.getItem("hb-j-"+month)||"null");if(s)journals[month]=s}catch(e){}}
  return journals[month];
}
function jday(ds){const m=ds.slice(0,7);const j=journals[m];if(!j)return null;if(!j.days[ds])j.days[ds]={tasks:[],memo:"",auto:[]};return j.days[ds]}
async function init(){
  let ok=false;
  const timer=setTimeout(()=>{if(!ok){note("계정 저장소에 연결하지 못해 이 브라우저에 저장하고 있어요.");startLocal()}},10000);
  try{
    const [db,user,assets,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("downloads")]);
    store.assets=assets;store.downloads=downloads;
    const id=user?await user.id():null;
    if(db&&id){
      store.db=db;store.uid=id;
      docRef("core").onSnapshot(async snap=>{
        if(!ok){ok=true;clearTimeout(timer);store.mode="db";const old=await loadSplit(snap.exists?JSON.parse(JSON.stringify(snap.data())):null);await boot();if(old){persist("core");setSave("저장 방식을 새로 바꾸는 중…")}return}
        if(snap.metadata.hasPendingWrites||store.dirty.core||writing.core)return;
        if(snap.exists&&JSON.stringify(snap.data())!==store.lastJSON.core)scheduleRemoteReload()
      },e=>{if(!ok){ok=true;clearTimeout(timer);note("계정 저장소를 열 수 없어 이 브라우저에 저장하고 있어요.");startLocal()}});
      return;
    }
  }catch(e){}
  if(!ok){ok=true;clearTimeout(timer);startLocal(true)}
}
function startLocal(quiet){
  if(store.mode!=="loading")return;
  store.mode="local";
  try{mergeCore(JSON.parse(localStorage.getItem("hb-core")||"null"))}catch(e){}
  if(!quiet)return boot();
  note("claude.ai에서 열면 계정에 저장돼서 다른 기기에서도 이어서 쓸 수 있어요. 지금은 이 브라우저에만 저장돼요.");
  boot();

const RULE_SEED={"body": "운암초등학교 도서관 운영 규정\n\n제1장 총칙\n\n제1조(설치) 운암초등학교 도서관(이하 ‘도서관’이라 한다)은 「학교도서관진흥법」과 본교 교육 계획에 의해 설치·운영하는 학교 교육 시설이다.\n제2조(목적) 도서관은 본교의 교육목표를 달성하기 위하여 교사와 학생의 교수-학습 활동을 지원하고, 학생의 자기주도적 학습 능력 신장을 목적으로 한다.\n제3조(자료) 도서관은 본교의 교육목표를 달성하기 위하여 국내외의 인쇄자료 및 시청각자료, 전자자료 등을(이하 '도서관 자료'라 한다) 수집·정리·보존·제공한다.\n제4조(운영) 본교 도서관의 운영 및 업무는 학교장의 감독을 받아 사서교사(또는 사서, 학교도서관 담당교사)가 담당한다.\n\n제2장 운영 규정\n\n제5조(운영) 본교 도서관은 개가제로 운영하며 다음의 이용자가 열람할 수 있다.\n 1. 본교 학생\n 2. 본교 교사 및 직원\n 3. 학부모 (단, 정규 수업시간 이후에만 이용할 수 있다.)\n제6조(개방 시간)\n 1. 평일: 08:30~16:00\n 2. 방학기간: 방학 중 개방일과 시간은 방학 전 별도 공지\n제7조(휴관일) 본교 도서관의 휴관일은 다음과 같다.\n 1. 공휴일 및 국경일\n 2. 학교장이 정하는 재량휴업일\n 3. 도서관 시설 유지 보수 및 장서 점검 기간\n제8조(관외 대출) 도서관 자료의 관외대출 기한은 도서관 장서량 및 수업시간 활용, 지역사회 개방 등을 고려하여 정한다.\n 1. 재학생: 1인 3권 7일간, 연장 1회, 7일\n 2. 교직원: 1인 10권 30일간, 연장 1회, 7일\n 3. 학부모: 1인 2권 7일간, 연장 1회, 7일\n제9조(대출·반납) 자료의 대출과 반납 방법은 다음과 같다.\n 1. 자료의 대출과 반납은 도서관 개방 시간에 자유롭게 할 수 있다. (단, 도서관 수업이 진행 중인 시간은 제한된다.)\n 2. 자료의 대출은 학생증(또는 개인별 바코드)을 이용하여 전산 관리하고, 대출한 자료를 연장 이용할 경우는 그 자료의 예약자와 중복되지 않는 경우에 한하여 1회 연장이 가능하다.\n제10조(대출 제한) 본교 소장 자료 중 참고자료, 이용제한도서, 파손도서 등 필요에 의해 지정한 자료의 경우는 대출을 제한할 수 있다.\n제11조(개인정보 보호) 본교 도서관을 이용하기 위해서는 최소한의 기본 정보 (이름, 학년, 반, 번호)를 수집하며, 이에 대한 동의는 학년 초에 학교에서 일괄 배부하는 「학생 개인정보 수집 이용 및 제3자 제공 동의서」로 대신한다. 전출 및 졸업 시 독서로DLS의 모든 정보는 삭제한다. 학부모 등 지역 주민 이용 시에는 서면 동의서를 받도록 한다.\n제12조(도서관 활용 수업) 도서관 활용 수업은 다음과 같다.\n 1. 도서관 활용 수업 대상: 전 학급\n 2. 도서관 활용 수업 시간: 독서로 학교도서관 활용 수업 예약을 통해 신청한다. 부득이하게 시간을 변경할 때에는 사전에 연락하여 조정할 수 있다.\n 3. 도서관 활용 수업 임장지도: 도서관 활용 수업 시간 전·후에는 반드시 담임교사나 담당 교사의 동행하에 인솔한다.\n제13조(연체자 처리) 대출한 자료의 반납 기한을 초과한 경우에는 반납 기일로부터 연체일 수만큼 자료 대출을 금한다.\n제14조(분실 자료 처리) 대출한 자료를 분실한 경우에는 동일한 자료로 변상한다. 절판 등의 사유로 동일 자료로 변상이 불가할 경우는 사서교사와 협의하여 대체자료로 변상할 수 있다.\n\n제3장 학교도서관운영위원회\n\n제15조(설치) 본교 도서관의 효율적인 운영을 위하여 「학교도서관진흥법」 제10조에 따라 학교도서관운영위원회를 둔다.\n제16조(구성) 학교도서관운영위원회는 다음과 같이 구성한다.\n 1. 학교도서관운영위원회는 위원장, 부위원장, 교사 위원, 학부모 위원, 학생 위원, 간사 등 10인 이내로 구성한다.\n 참고. 학교 여건에 따라 학부모 위원, 학생 위원, 외부 위원을 포함할 수 있다.\n\n제17조(기능) 학교도서관운영위원회는 다음 각 호의 사항을 심의한다.\n 1. 학교도서관 운영계획\n 2. 자료의 수집·제작·개발 등과 관련된 예산의 책정\n 3. 자료의 폐기·제적\n 4. 학교도서관의 행사와 활동\n 5. 그 밖의 학교도서관 운영에 필요한 사항\n제18조(회의)\n 1. 학교도서관운영위원회 회의는 매 학년 초에 정기적으로 개최하고, 필요 시 위원장이 수시로 소집ㆍ개최할 수 있다.\n 2. 학교도서관운영위원회 회의는 재적위원 과반수의 출석으로 개의하고 출석위원 과반수의 찬성으로 의결한다.\n제19조(집행)\n 1. 위원장은 학교도서관운영위원회의 회의를 통해 결정된 사항을 교육 계획에 반영할 수 있도록 안내한다.\n 2. 학교도서관운영위원회는 「학교도서관진흥법」 및 동법 시행령을 준수한다.\n\n제4장 보조 인력\n\n제20조(조직) 본교 도서관에는 사서교사(또는 사서, 학교도서관 담당교사)의 업무를 지원할 수 있는 학부모 자원봉사자, 도서부 등 기타 조직을 둘 수 있다.\n제21조(선발 및 혜택) 학년 초 별도 내부 계획에 따라 적정 인원을 선발하도록 하며 경우에 따라 봉사시간을 부여하거나. 도서관 행사에 우선 참여할 수 있는 기회를 제공할 수 있다.\n\n제5장 자료의 수집 및 정리\n\n제22조(자료의 수집) 본교 도서관에서 수집하는 자료는 구입, 기증, 생산 등에 의한다.\n제23조(자료의 종류) 본교 도서관에 수집되는 자료의 종류는 다음과 같다.\n 1. 일반 도서\n 2. 연속 간행물 (신문, 잡지 등)\n 3. 시청각 자료\n 4. 전자 자료\n 5. 행정·장학 간행물\n 6. 교과서 및 지도서\n 7. 학교 발간 자료 (교직, 앨범, 학급지, 문예지, 교육계획서 등)\n 8. 그 외 자료\n제24조(자료 선택 기준) 도서관 자료로 수집을 결정하는 선택 기준은 다음과 같다.\n 1. 학교 교육과정\n   가. 학교 교육목표 달성에 도움을 주는 자료\n   나. 교육과정과 일치되고 연관되는 자료\n   다. 생활지도, 창의적체험활동, 진로지도 등에 도움을 주는 자료\n 2. 이용자의 특성\n   가. 학생의 발달단계: 지적 능력 이외에 정서 함양, 사회성 발달 고려\n   나. 학습 능력: 문제해결능력 신장에 도움을 주는 자료\n   다. 교사의 교과 지도에 관련된 자료\n 3. 자료의 지적 내용\n   가. 사회적，도덕적으로 용납된 자료\n   나. 다양한 관점을 대표하고 있는 자료\n   다. 사고능력을 키워줄 수 있는 자료\n 4. 자료의 물리적 특성\n   가. 제본 상태\n   나. 활자 및 종이의 질\n   다. 그림, 삽화의 질\n 5. 한정된 예산으로 운영되므로 최대의 성과를 올릴 수 있는 자료 구성•선정\n 6. 기존 자료에 대한 평가 및 자료 구성 계획\n 7. 구입 제외 자료\n   가. 개인의 학습을 위한 자료 : 수험서, 문제지, 교과서 등\n   나. 학생들의 정서에 악영향을 주는 자료: 폭력물, 음란물 등 간행물의 유해성 심의 기준, 청소년유해매체물 심의 기준에 따라 유해물로 판단될 수 있는 경우\n (한국간행물윤리위원회의 유해간행물 및 청소년유해간행물 심의대상 및 기준, 목록표 등을\n 참고하도록 한다.)\n   다. 이외에 학교도서관운영위원회가 판단하는 부적합 자료인 경우\n제25조(자료 구입 절차) 자료의 구입 절차는 다음과 같다.\n 1. 자료의 구입은 다음의 절차를 거쳐 사서교사(또는 사서, 학교도서관 담당교사)가 내부결재를 거쳐 행정실에 구입 의뢰한다.\n   가. 구입 예정 도서목록 학교홈페이지 안내(1주일)\n   나. 학교도서관운영위원회 개최 및 심의\n   다. 학교장 결재 득한 후 행정실 구입 의뢰\n 2. 수행평가자료, 교내 학교 행사 등 교육과정 지원 자료로 긴급을 요할 경우는 선 구입 후 학교도서관운영위원회 개최시 사후 보고 한다.\n 3. 1종 1권 구입을 원칙으로 하고 필요한 경우 복본은 2권을 넘지 않도록 한다.\n제26조(구입 방법) 자료 구입의 방법 및 경비 지출에 관한 사항은 행정실과 협의하여 추진한다.\n 참고. 자료구입 시 위탁 전산 입력 및 장비용역은「출판문화산업진흥법」제22조 제8항의 ‘경제상 이익’에 해당하지 않으며, 학교에서 해당 작업을 수행할 경우에는 자료구입비와 별도로 용역 계약 체결을 통하여 추진해야 함\n제27조(자료 정리) 본교 도서관 자료는 분류기호 KDC 제6판, 저자기호 리채절 한글순 저자기호표 제5판(동서)， Cutter Sanborn three-figure(양서)로 전산 입력한다.\n 1. 등록번호는 입수 순으로 부여한다.\n\n   · 도서자료: 숫자 6자리 (000001)\n   · 비도서자료: B+숫자 5자리 (B00001)\n\n 2. 전산 입력은 독서로 학교도서관업무지원시스템(Digital Library System, 이하 ‘독서로DLS’) 을 사용한다.\n 3. 분류 시 다음의 원칙에 의해 일관성을 유지한다.\n   가. 특정 주제에 관한 총서나 전집 등은 일반 총서(080)에 분류하지 않고 특정주제 아래 분류한다.\n   나. 문학은 저자의 국적에 상관없이 쓰여진 나라의 말로 분류한다.\n   다. 두 가지 이상의 주제를 담은 논문집이나 일반 수필집은 040에 분류하지만, 특정 주제에 관한 논문집이나 수필집은 그 주제 아래 분류한다.\n   라. 전기(傳記)는 998에 분류하지 않고, 특정 주제 아래 분류한다.\n 4. 도서관의 주제별 자료 구성 비율은 다음 기준을 따른다. 총류 4 · 철학 2 · 종교 2 · 사회과학 8 · 자연과학 13 · 기술과학 8 · 예술 5 · 언어 2 · 문학 25 · 역사 16 · 그림책 15 (계 100)\n 5. 사용하는 별치기호는 다음과 같으며, 표에서 정하지 않은 자료에 대해서는 별도의 기호를 추가할 수 있다.\n   [인쇄자료] R: 참고도서(백과사전, 사전, 도감, 편람, 연감, 통계, 색인집 등)\n   [인쇄자료] T: 교사용, 학부모 도서\n   [인쇄자료] A: 만화\n   [인쇄자료] 그: 유아용 도서(그림책)\n   [인쇄자료] E: 영어원서\n   [비도서자료] V: DVD, CD, 영상자료, 멀티미디어 자료 등\n\n제6장 기증 자료\n\n제28조(기증 절차 및 활용)\n 1. 기증 자료는 구입 자료의 선택 기준에 의하여 학교도서관운영위원회 심의절차를 거쳐 소장유무를 결정하고 구입 자료와 함께 서가에 비치한다. 단, 기증 자료임을 표시하기 위하여 기증 인을 날인하거나, 기증 라벨 스티커를 부착한다.\n 1. 자료를 기증하고자 하는 기증자는 본교 도서관에 사전 협의함을 원칙으로 하며 기증한 자료는 추후 반환 청구를 할 수 없다.\n 2. 도서관 자료로 등록 가능한 자료만 수증하는 것을 원칙으로 하며 본교 도서관 목적에 위배된다고 판단되는 경우 기증을 거부할 수 있다.\n 3. 도서관 자료로 등록 제외된 기증 자료는 재기증되거나 도서 나눔전 등 교내 행사에 활용하거나 폐기할 수 있다.\n제29조(기증 자료 제외 기준) 다음에 해당하는 자료는 기증받지 않는다.\n 1. 훼손이 심한 자료\n 2. 신판이 출간된 구판 자료\n 3. 복본이 필요한 경우를 제외한 자료\n 4. 출간된 지 5년 이상 된 자료\n 5. 문제집, 수험서, 참고서, 연속 간행물의 일부\n 6. 유해 자료\n 7. 기타 도서관 자료로 부적합한 자료\n\n제7장 자료의 점검과 평가\n\n제30조(목적) 장서점검과 평가의 목적은 다음과 같다.\n 1. 장서점검: 도서관 자료의 현황을 파악하고, 파손자료를 수리하며 분실자료 등을 파악하여 자료의 최신성과 이용률을 향상시키기 위하여 장서점검을 실시한다.\n 2. 장서평가: 도서관 자료의 이용도를 파악하여 예산을 적절히 분배하고, 장서의 노화를 점검하고 복본의 적절성 등을 파악하기 위하여 장서평가를 실시한다.\n제31조(시기) 장서점검과 평가는 주기로 정기적으로 실시한다. 사서교사는 수시로 서가를 직접 관찰하여 장서의 최신성과 물리적 상태 등을 관찰한다.(※ 필요에 따라 탄력적으로 운영한다.)\n제32조(방법) 장서점검과 평가는 다음과 같은 방법으로 실시한다.\n 1. 장서점검: 장서점검으로 인한 휴관일을 공지하고 장서점검기를 이용하여 독서로DLS로 점검한다.\n 2. 장서평가\n   ① 참고도서류, 잡지, 시청각 자료 : 관내 이용 자료의 분석에 의한 평가\n   ② 대출 자료의 분석에 의한 평가\n\n제8장 자료의 제적 및 폐기\n\n제33조(범위) 본교 도서관에서는 자료의 질적 관리와 효율적인 정보 제공을 위하여 「도서관법」 및 「학교도서관진흥법」 등에서 정한 범위 내에서 제적•폐기할 수 있다.\n (「도서관법 시행령」 제33조 제3항)\n제34조(기준) 본교 도서관 자료의 제적ㆍ폐기의 기준은 다음과 같다. 단, 연구가치가 있거나, 절판된 자료, 향토자료, 희귀자료 등은 제적ㆍ폐기 대상에서 제외한다.\n 1. 이용가치를 상실한 자료\n 2. 훼손, 파손 또는 오손된 자료\n 3. 대출이나 이용이 전혀 없는 다수의 복본 자료\n 4. 현재 오류로 판명된 학설이나 이론을 담고 있는 자료\n 5. 불가항력적인 재해, 사고, 그 밖에 이에 준하는 사태로 인해 유실된 자료\n 6. 기타 학교장이 필요하다고 정하는 사항\n제35조(절차) 제적 및 폐기의 절차는 다음과 같다.\n 1. 장서점검 혹은 장서평가에 의해 발견된 제적ㆍ폐기 대상 자료의 목록을 작성하여 학교도서관운영위원회에 보고한다.\n 2. 학교도서관운영위원회는 다음 사항을 고려하여 제적ㆍ폐기 대상 자료를 심의ㆍ확정한다.\n   가. 이용 가치 상실의 적절성\n   나. 전체 장서의 배분 비율\n   다. 서가 공간의 효율성\n   라. 제적 및 폐기 제외 대상 여부\n 3. 사서교사(또는 사서, 학교도서관 담당교사)는 내부 결재 후 제적ㆍ폐기 처리한다.\n\n제9장 관내 규율\n\n제36조(소지품 관리) 이용자는 간단한 필기도구만을 지참할 수 있고, 가방 등 소지품은 별도 지정된 장소에 보관한다.\n제37조(이용자 준수사항) 사서교사(또는 학교도서관 업무 담당자)는 다음의 이용자 준수사항을 홍보한다.\n 1. 정숙·청결·질서를 유지한다.\n 2. 이용한 자료는 반납대에 반납하며, 이용한 자리는 정리 정돈을 철저히 한다.\n 3. 도서관 자료 및 시설은 소중하게 다루며, 필요한 부분을 자르거나 훼손해서는 안 된다.\n 4. 자료 대출은 반드시 본인의 대출증을 사용해야 한다. 타인의 대출증을 사용하다 적발 시 3일간 대출을 정지한다.\n 5. 휴대폰 통화 등은 도서관 밖에서 사용한다.\n 6. 대출 시 반드시 본인의 대출증을 제시한다.(대리대출 금지)\n 7. 모든 이용자는 이용시간을 준수한다.\n제38조(자료 등의 변상) 도서관 자료나 시설물을 분실하거나 고의로 훼손한 경우에는 동일한 것으로 변상하여야 한다.\n\n부칙\n\n제1조 본 규정은 2025년 4월 1일부터 시행한다.\n제2조 본 규정은 상위 규정의 개정이 있을 때, 혹은 개정이 필요할 때 학교도서관운영위원회의 제적 과반 수 이상 출석과 출석 위원 반수의 동의를 얻어 개정할 수 있다.\n제3조 본 규정에 의하여 심의된 사항은 학교장의 결재를 득한 후 시행한다.", "entries": [["도서관 운영", "개방 시간(평일)", "08:30~16:00"], ["도서관 운영", "방학 중 개방", "방학 전 별도 공지"], ["도서관 운영", "휴관일", "공휴일·국경일, 재량휴업일, 시설 보수·장서 점검 기간"], ["도서관 운영", "학부모 이용", "정규 수업시간 이후에만"], ["도서관 운영", "도서관 활용 수업", "전 학급 · 독서로 활용 수업 예약으로 신청 · 담임(담당)교사 동행 인솔"], ["도서관 운영", "운영 규정 시행일", "2025. 4. 1."], ["대출 규정", "재학생", "1인 3권 7일 (연장 1회 7일)"], ["대출 규정", "교직원", "1인 10권 30일 (연장 1회 7일)"], ["대출 규정", "학부모", "1인 2권 7일 (연장 1회 7일)"], ["대출 규정", "연체", "연체일 수만큼 대출 정지"], ["대출 규정", "분실·훼손", "동일 자료로 변상 (절판 등은 사서교사와 협의해 대체자료)"], ["대출 규정", "타인 대출증 사용", "3일간 대출 정지"], ["대출 규정", "대출 제한 자료", "참고자료, 이용제한도서, 파손도서 등"], ["자료 정리", "분류", " /* 휴지통: 지우기 전후를 비교해 사라진 항목(id가 있는 목록 항목, 차시·출석 기록)을 core.trash에 30일 보관한다 */

    if(k in a)trashDiff(b[k],a[k],[...path,k],out);else if(path[path.length-1]==="logs"&&b[k]&&typeof b[k]==="object")out.push({path,key:k,item:b[k]})})}
}
function trashKind(path){const p=path.filter(x=>x[0]!=="#").join(".");

  const m=M.find(x=>p===x[0]||p.startsWith(x[0]+"."));return m?m[1]:"항목"}
function trashLabel(e){const it=e.item||{};const p=e.path.join(".");
  if(e.key){const[d,pn]=e.key.split("|");return `${md(d)} ${pn||""} ${it.cls||""} 기록`.replace(/\s+/g," ").trim()}

  if(p==="lessons.bookings")return `${it.repeat?"매주 ":md(it.date)+" "}${it.period||""} ${it.cls||""} ${it.subject||""}`.trim();
  if(p==="lessons.extras")return `${md(it.ds)} ${it.period} ${it.text}`;
  if(e.path[0]==="@j")return `${md(e.path[3])} ${it.text||""}`;

function trashCollect(before,after){
  const out=[];const bc=JSON.parse(before.core),ac=JSON.parse(after.core);trashDiff(bc,ac,[],out);
  const bj=JSON.parse(before.j),aj=JSON.parse(after.j);Object.keys(bj).forEach(mk=>{if(aj[mk])trashDiff(bj[mk],aj[mk],["@j",mk],out)});
  const got=out.filter(e=>e.key||!(after.core.includes(`"id":"${e.item.id}"`)||after.j.includes(`"id":"${e.item.id}"`)));if(!got.length)return;
  const now=Date.now();core.trash=[...got.map(e=>({id:uid(),t:now,kind:trashKind(e.path),label:trashLabel(e),...e})),...(core.trash||[])].filter(x=>now-x.t<TRASH_DAYS*864e5).slice(0,TRASH_MAX);persist("core");

async function trashRestore(tid){

function sem(ay){return core.settings.sem[ay]||{}}
function isVac(ds){
  const ay=ayOf(P(ds)),s=sem(ay),n=sem(ay+1);
  if(s.summer&&s.s2&&ds>s.summer&&ds<s.s2)return true;
  if(s.winter&&ds>s.winter&&(!n.s1||ds<n.s1))return true;

}

function isJDay(d){const w=d.getDay(),ds=ymd(d);return w>0&&w<6&&!offName(ds)&&(!isVac(ds)||isVacWork(ds))}
function nextJ(ds){let d=addD(P(ds),1);for(let i=0;i<120;i++){if(isJDay(d))return ymd(d);d=addD(d,1)}return ymd(addD(P(ds),1))}

function nextWork(ds){let d=addD(P(ds),1);for(let i=0;i<60;i++){if(isWork(d))return ymd(d);d=addD(d,1)}return ymd(addD(P(ds),1))}

/* 실수 방지 잠금: 화면에서 바로 저장되는 입력 칸(규정 본문, 메모장, 예산 표, 도서목록 표 등)은 평소엔 잠겨 있고 '고치기'를 눌러야 바뀐다.
   고치는 동안 '고치기 전으로'를 누르면 고치기 시작한 때의 내용으로 돌아간다. 업무일지 메모·체크 표시는 자주 쓰는 칸이라 잠그지 않는다. */
/* 긴 목록 쪽 나누기: .list 안의 항목이 PG_SIZE+2개를 넘으면 PG_SIZE개씩 쪽으로 나눈다. 화면·창 어디든 자동 적용. */
const PG_SIZE=8,PG_H=440;const pgState={},pgSeen={};
function paginate(root,prefix){
  $$(".list, table.dtab>tbody",root).forEach((L,i)=>{if(L.dataset.pgd||L.closest("[data-nopg]"))return;const isT=L.tagName==="TBODY";
    if(isT&&(L.closest(".modal")||[L.parentElement.parentElement,L.parentElement].some(x=>x&&x.style&&x.style.maxHeight)))return;
    const kids=[...L.children].filter(c=>!c.classList.contains("empty"));if(kids.length<3)return;
    // 항목 높이를 재서 한 쪽에 PG_H(px)쯤 들어가게 나눈다. 내용이 긴 항목은 적게, 짧은 항목은 많이 들어간다. 높이를 못 재면 개수(PG_SIZE)로 나눈다.
    const hs=kids.map(k=>k.offsetHeight||0);const total=hs.reduce((a,b)=>a+b,0);const pageOf=[];
    if(total>0){if(total<=PG_H*1.3)return;let pg=0,acc=0;hs.forEach((h,n)=>{if(n&&acc+h>PG_H){pg++;acc=0}acc+=h+6;pageOf.push(pg)})}
    else{if(kids.length<=PG_SIZE+2)return;kids.forEach((k,n)=>pageOf.push(Math.floor(n/PG_SIZE)))}
    const pages=pageOf[pageOf.length-1]+1;if(pages<2)return;
    L.dataset.pgd=1;const key=prefix+":"+i;
    const sig=kids.map(k=>((k.textContent||"")+"|"+$$("input,textarea,select",k).map(x=>x.value).join("|")).slice(0,120));const old=pgSeen[key];pgSeen[key]=sig;
    if(old&&sig.length===old.length+1){const set=new Set(old);const ni=sig.findIndex(t=>!set.has(t));if(ni>=0)pgState[key]=pageOf[ni]}
    const bar=document.createElement("div");bar.className="pager";bar.innerHTML=`<button type="button" class="btn ghost sm" data-pgprev aria-label="앞쪽">‹</button><span class="num"></span><button type="button" class="btn ghost sm" data-pgnext aria-label="다음 쪽">›</button>`;
    const show=()=>{let pg=Math.min(Math.max(pgState[key]||0,0),pages-1);pgState[key]=pg;kids.forEach((k,n)=>{k.style.display=pageOf[n]===pg?"":"none"});
      $("span",bar).textContent=`${pg+1} / ${pages}쪽 · 모두 ${kids.length}개`;$("[data-pgprev]",bar).disabled=pg===0;$("[data-pgnext]",bar).disabled=pg===pages-1};
    bar.addEventListener("click",e=>{e.stopPropagation();if(e.target.closest("[data-pgprev]"))pgState[key]--;else if(e.target.closest("[data-pgnext]"))pgState[key]++;else return;show()});
    const host=isT?(L.parentElement.parentElement&&L.parentElement.parentElement.tagName==="DIV"&&L.parentElement.parentElement.children.length===1?L.parentElement.parentElement:L.parentElement):L;
    host.after(bar);show()})}
/* 긴 화면 나누기: 한 화면에 구역(제목 줄)이 3개 이상이고 길이가 화면의 1.3배를 넘으면, 구역 이름을 작은 탭으로 올리고 한 번에 한 구역만 보여 준다. '모두 보기'로 예전처럼 볼 수 있다. */

function capCells(root){$$(".lcell",root).forEach(c=>{if(c.dataset.capd)return;const its=$$(":scope > .it",c);if(its.length<=5)return;c.dataset.capd=1;const ds=c.dataset.lday;const open=cellOpen.has(ds);

/* 수업 달력이 길면 주 단위로 나눠 보여 준다 (폰 2주, PC 3주씩). 처음엔 오늘이 든 쪽이 열린다. */
const wkState={};
function weekPages(root){const cells=$$(".lcell",root);if(!cells.length)return;const rows=[...new Set(cells.map(c=>c.parentElement))];const grid=rows[0].parentElement;if(rows.length<2||grid.dataset.wkd)return;grid.dataset.wkd=1;
  const weeks=rows.length,per=innerWidth<=640?2:3;if(grid.scrollHeight<=innerHeight*0.9||weeks<=per)return;const pages=Math.ceil(weeks/per);const key=ui.lcal;
  if(wkState[key]===undefined){const ti=rows.findIndex(r=>$(".lcell.today",r));wkState[key]=ti<0?0:Math.floor(ti/per)}
  const bar=document.createElement("div");bar.className="pager";bar.innerHTML=`<button type="button" class="btn ghost sm" data-wp="-1" aria-label="앞 주">‹</button><span class="num"></span><button type="button" class="btn ghost sm" data-wp="1" aria-label="다음 주">›</button><button type="button" class="btn ghost sm" data-wp="all"></button>`;

function semEvents(ay){const s=sem(ay),L={s1:"1학기 개학식",summer:"여름방학식",s2:"2학기 개학식",winter:"겨울방학식"};return Object.keys(L).filter(k=>s[k]).map(k=>({date:s[k],name:L[k]}))}
function vCal(){
  const v=freshView();
  const [Y,M]=ui.calMonth.split("-").map(Number);
  const first=new Date(Y,M-1,1),last=new Date(Y,M,0);
  let wkStart=monday(first);if(first.getDay()===6)wkStart=addD(wkStart,7);if(first.getDay()===0)wkStart=addD(first,1);
  const semEv=[...semEvents(ayOf(first)),...semEvents(ayOf(first)-1)];
  let html="";
  for(let w=wkStart;w<=last;w=addD(w,7)){
    const cols=[0,1,2,3,4].map(i=>ymd(addD(w,i)));
    const a=cols[0],b=cols[4];
    const bars=core.events.filter(e=>e.type!=="day"&&e.start<=b&&(e.end||e.start)>=a).sort((x,y)=>x.start<y.start?-1:1);
    // 줄 배치
    const lanes=[];const placed=bars.map(e=>{const s=Math.max(0,cols.findIndex(c=>c>=e.start)),en=cols.reduce((k,c,i)=>c<=(e.end||e.start)?i:k,0);let L=0;while(lanes[L]&&lanes[L].some(r=>!(en<r[0]||s>r[1])))L++;(lanes[L]=lanes[L]||[]).push([s,en]);return{e,s,en,L}});
    const nL=lanes.length;
    let g=`<div class="wk">`;
    cols.forEach((ds,i)=>{const d=P(ds);const cls=[d.getMonth()!==M-1?"out":"",ds===todayS?"today":"",isVac(ds)?"vac":""].join(" ");
      g+=`<div class="cell ${cls}" data-day="${ds}" style="grid-column:${i+1};grid-row:1 / span ${nL+2}"></div>
      <div class="dn" style="grid-column:${i+1};grid-row:1"><span class="num">${d.getDate()}</span>${offName(ds)?`<span class="hol">${offName(ds)}</span>`:""}</div>`});
    placed.forEach(p=>{g+=`<div class="bar" data-ev="${p.e.id}" style="grid-column:${p.s+1} / ${p.en+2};grid-row:${p.L+2}">${p.e.start>=a?`<span class="h l" data-hl="${p.e.id}"></span>`:""}${esc(p.e.name)}${(p.e.end||p.e.start)<=b?`<span class="h r" data-hr="${p.e.id}"></span>`:""}</div>`});
    cols.forEach((ds,i)=>{
      let it="";
      semEv.filter(x=>x.date===ds).forEach(x=>it+=`<span class="it" style="background:var(--leaf-soft);color:var(--leaf)">${esc(x.name)}</span>`);
      core.events.filter(e=>e.type==="day"&&e.start===ds).forEach(e=>it+=`<button type="button" class="it day" data-ev="${e.id}">${esc(e.name)}</button>`);
      core.promos.filter(p=>p.date===ds).forEach(p=>it+=`<button type="button" class="it promo" data-promo="${p.id}"><small>홍보물</small>${esc(p.name)}</button>`);
      bookingsOn(ds).forEach(b=>it+=`<button type="button" class="it day" data-cbook="${b.id}|${ds}"><small>${b.coop?"협력":"예약"}</small>${esc(b.period)} ${esc(bookLabel(b))}</button>`);
      meetingsOn(ds).forEach(m=>it+=`<button type="button" class="it memo" data-cmeet="${m.id}" style="border-style:solid"><small>회의</small>${esc(m.title||"회의")}</button>`);
      (core.calMemos[ds]||[]).forEach(m=>it+=`<button type="button" class="it memo" data-cmemo="${ds}|${m.id}">${esc(m.text)}</button>`);
      it+=xcCalItems(ds);
      g+=`<div class="items" style="grid-column:${i+1};grid-row:${nL+2}">${it}</div>`});
    html+=g+`</div>`;
  }
  v.innerHTML=`<div class="grid-main"><section class="panel">
    <div class="phead"><div class="row"><button class="circbtn" data-cm="-1" type="button" aria-label="이전 달">‹</button><h2 style="font-size:22px">${Y}년 ${M}월</h2><button class="circbtn" data-cm="1" type="button" aria-label="다음 달">›</button><button class="btn line sm" data-cm="0" type="button">오늘</button></div>
    <span class="small faint">날짜를 누르면 행사·메모·홍보물을 넣어요. 막대 양끝을 끌면 기간이 바뀌어요.</span></div>
    <div class="cal"><div class="calhead"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>${html}</div></section>
    <div class="stack">${monthTodoCard(ui.calMonth)}</div></div>`;
  bindMonthTodos(v);
  v.addEventListener("click",e=>{
    if(e.target.closest(".h"))return;
    const cm=e.target.closest("[data-cm]");if(cm){const n=+cm.dataset.cm;ui.calMonth=n===0?ym(TODAY):ym(new Date(Y,M-1+n,1));render();return}
    const ev=e.target.closest("[data-ev]");if(ev){openEvent(core.events.find(x=>x.id===ev.dataset.ev));return}
    const pr=e.target.closest("[data-promo]");if(pr){openPromo(core.promos.find(x=>x.id===pr.dataset.promo));return}
    const mt=e.target.closest("[data-cmeet]");if(mt){openMeeting(core.info.meetings.find(x=>x.id===mt.dataset.cmeet));return}
    const cb=e.target.closest("[data-cbook]");if(cb){const[bid,bds]=cb.dataset.cbook.split("|");openBooking(core.lessons.bookings.find(x=>x.id===bid),false,bds);return}
    const cmo=e.target.closest("[data-cmemo]");if(cmo){const[ds,id]=cmo.dataset.cmemo.split("|");openCalMemo(ds,id);return}
    const day=e.target.closest("[data-day]");if(day)openQuickAdd(day.dataset.day);
  });
  // 막대 끝 끌기
  v.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-hl],[data-hr]");if(!h)return;e.preventDefault();e.stopPropagation();
    const id=h.dataset.hl||h.dataset.hr;const left=!!h.dataset.hl;const ev=core.events.find(x=>x.id===id);h.setPointerCapture(e.pointerId);
    const mv=pe=>{const el=document.elementsFromPoint(pe.clientX,pe.clientY).find(x=>x.dataset&&x.dataset.day);$$(".cell").forEach(c=>c.style.outline="");if(el)el.style.outline="2px solid var(--accent)"};
    const up=pe=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);
      const el=document.elementsFromPoint(pe.clientX,pe.clientY).find(x=>x.dataset&&x.dataset.day);
      if(el){const ds=el.dataset.day;if(left){ev.start=ds<=ev.end?ds:ev.end}else{ev.end=ds>=ev.start?ds:ev.start}persist("core")}render()};
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up)});
}
function openQuickAdd(ds){

  let kind="ev";
  const body=()=>`<div class="seg" role="group">${[["ev","행사"],["memo","메모"],["promo","홍보물"],["off","쉬는 날"]].map(k=>`<button type="button" data-k="${k[0]}" aria-pressed="${kind===k[0]}">${k[1]}</button>`).join("")}</div>
   ${kind==="ev"?`<label class="f">행사명<input id="qa-name" autocomplete="off"></label>
     <label class="chk"><input type="radio" name="qa-t" value="week" checked><span class="t">주간 행사 · ${weekLabel(d)} (${md(ymd(mon))}~${md(ymd(fri))})</span></label>
     <label class="chk"><input type="radio" name="qa-t" value="day"><span class="t">하루 행사 · ${md(ds)}</span></label>`

   :kind==="off"?`<label class="f">이름<input id="qa-name" autocomplete="off" placeholder="예: 재량휴업일, 개교기념일"></label><span class="small faint">${md(ds)}이 학교 쉬는 날로 들어가요. 여러 날은 ⚙ 설정 → 학사일정에서 넣어요.</span>`
   :`<label class="f">홍보물 이름<input id="qa-name" autocomplete="off" placeholder="예: 겨울방학 대출 안내"></label><span class="small faint">${md(ds)} 게시로 들어가요.</span>`}`;
  const m=modal(`${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]})`,body(),`${kind==="ev"?`<button class="linkbtn" data-more type="button">자세히 입력하기</button>`:""}<span class="sp"></span><button class="btn ghost" data-close type="button">닫기</button><button class="btn" data-ok type="button">추가</button>`);
  const redraw=()=>{$(".mb",m).innerHTML=body();$(".mf",m).innerHTML=`${kind==="ev"?`<button class="linkbtn" data-more type="button">자세히 입력하기</button>`:""}<span class="sp"></span><button class="btn ghost" data-close type="button">닫기</button><button class="btn" data-ok type="button">추가</button>`;$("#qa-name").focus()};
  setTimeout(()=>{const q=$("#qa-name");q&&q.focus()},30);
  const make=()=>{const name=$("#qa-name").value.trim()||(kind==="off"?"쉬는 날":"");if(!name){$("#qa-name").focus();return null}
    if(kind==="ev"){const t=$('input[name="qa-t"]:checked',m).value;const e=newEvent(name,t,t==="day"?ds:ymd(mon),t==="day"?ds:ymd(fri));core.events.push(e);return e}
    if(kind==="memo"){(core.calMemos[ds]=core.calMemos[ds]||[]).push({id:uid(),text:name});return true}
    if(kind==="off"){(core.settings.offDays=core.settings.offDays||[]).push({id:uid(),start:ds,end:"",name});return true}
    core.promos.push({id:uid(),name,date:ds,memo:"",yearly:false,done:false,poster:""});return true};
  m.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(k){kind=k.dataset.k;redraw();return}
    if(e.target.closest("[data-ok]")){if(make()){persist("core");closeModal();render()}}

function postOf(e){e.post=Object.assign({classes:"",students:"",improve:"",report:false,photos:false,settle:false},e.post||{});return e.post}

function newEvent(name,type,start,end){return{id:uid(),name,type,start,end:type==="day"?start:end,content:"",budget:"",prize:"",material:"",qty:"",prep:core.settings.prep.filter(p=>p.def).map(p=>p.name),done:[],poster:"",result:""}}
function weeksOfMonth(y,m){const out=[];let d=monday(new Date(y,m-1,1));for(let i=0;i<7;i++){const th=addD(d,3);if(th.getMonth()===m-1)out.push({n:Math.ceil(th.getDate()/7),mon:ymd(d),fri:ymd(addD(d,4))});d=addD(d,7)}return out}
function posterSlot(url,id){return `<div class="row" style="align-items:flex-start;gap:12px">

   <label class="addcard" style="width:130px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;cursor:pointer">${store.assets?`포스터 사진 고르기<br>(끌어다 놓아도 돼요)<input type="file" accept="image/*" id="${id}" hidden>`:`claude.ai에서 열면 포스터를 올릴 수 있어요`}</label></div>`}
async function uploadPoster(file){if(!store.assets||!file)return null;try{toast("포스터 올리는 중…");const r=await store.assets.upload(file);return r.url}catch(e){toast("포스터를 올리지 못했어요");return null}}
function bindPoster(m,obj,redraw){
  const go=async f=>{const u=await uploadPoster(f);if(u){obj.poster=u;redraw()}};

    const len=Math.round((P(e.end||e.start)-P(e.start))/864e5);start=w.mon;end=ymd(addD(P(w.mon),Math.min(len,4)))}
  const n={...JSON.parse(JSON.stringify(e)),id:uid(),from:e.id,start,end,done:[],poster:"",result:"",post:{classes:"",students:"",improve:"",report:false,photos:false,settle:false},lastYearNote:e.post&&e.post.improve||""};

/* 행사 준비 목록이 바뀌었을 때 예전 행사에 반영할지 */
function prepChanges(st){
  const orig=core.settings.prep;const evAll=core.events;const fut=evAll.filter(e=>evRange(e)[1]>=todayS);
  const renames=st.prep.filter(p=>p._o&&p._o!==p.name&&p.name.trim()).map(p=>({o:p._o,n:p.name,cnt:evAll.filter(e=>e.prep.includes(p._o)).length})).filter(r=>r.cnt);
  const dels=orig.map(p=>p.name).filter(o=>!st.prep.some(p=>p._o===o)).map(o=>({o,cnt:evAll.filter(e=>e.prep.includes(o)).length})).filter(r=>r.cnt);
  const adds=st.prep.filter(p=>p.def&&!(orig.find(q=>q.name===p._o)||{}).def).map(p=>({n:p.name,cnt:fut.filter(e=>!e.prep.includes(p._o||p.name)).length})).filter(r=>r.cnt);
  return{renames,dels,adds,total:renames.length+dels.length+adds.length};
}
function prepApply(st,toOld){
  if(toOld){const ch=prepChanges(st);
    core.events.forEach(e=>{
      ch.renames.forEach(r=>{e.prep=e.prep.map(x=>x===r.o?r.n:x);e.done=e.done.map(x=>x===r.o?r.n:x)});
      ch.dels.forEach(r=>{e.prep=e.prep.filter(x=>x!==r.o);e.done=e.done.filter(x=>x!==r.o)});
      if(evRange(e)[1]>=todayS)ch.adds.forEach(r=>{if(!e.prep.includes(r.n))e.prep.push(r.n)})});
    Object.values(core.pmonths).forEach(pm=>Object.values(pm).forEach(x=>{ch.renames.forEach(r=>{x.done=(x.done||[]).map(y=>y===r.o?r.n:y)})}));
  }
  st.prep.forEach(p=>delete p._o);core.settings=st;
}

const L=()=>core.lessons;

    .map(x=>({pname:x.p.name,start:x.p.start,end:x.p.end,text:x.text,...parseLesson(x.text),key:`${ds}|${x.p.name}`,ds}));
  const moved=Object.entries(mv).filter(([k,v])=>v.to===ds&&!sk[k]).map(([k,v])=>{const[od,op]=k.split("|");const text=ttAt(od)[`${P(od).getDay()}|${op}`];const pr=perOf(v.period)||{start:"09:00",end:"09:40"};
    return text?{pname:v.period,start:pr.start,end:pr.end,text,...parseLesson(text),key:k,ds,moved:true,from:od,fromP:op}:null}).filter(Boolean);
  const extra=(L().extras||[]).filter(e=>e.ds===ds).map(e=>{const pr=perOf(e.period)||{start:"09:00",end:"09:40"};return{pname:e.period,start:pr.start,end:pr.end,text:e.text,...parseLesson(e.text),key:extraKey(e),ds,extra:e}});
  return[...base,...moved,...extra].sort((a,b)=>perIdx(a.pname)-perIdx(b.pname));

/* 시간표 바뀜: lessons.ttHist=[{until,tt}] — until 날까지는 그 시간표, 그 뒤로는 다음 것, 마지막은 지금 시간표(lessons.tt) */
function ttHist(){return(L().ttHist||[]).slice().sort((a,b)=>a.until<b.until?-1:a.until>b.until?1:0)}
function ttAt(ds){const h=ttHist().find(x=>ds<=x.until);return h?h.tt:L().tt}

function extraKey(e){return `${e.ds}|${e.period}|+${e.id}`}
function lessonsOnBase(ds){const wd=P(ds).getDay();const tt=ttAt(ds);return classPeriods().map(p=>[p.name,tt[`${wd}|${p.name}`]]).filter(x=>x[1]&&inSpan(x[1],ds,tt===L().tt?`${wd}|${x[0]}`:null)).map(x=>x[0]+":"+x[1])}
/* 학년·과목별 수업 기간: lessons.spans["1|독서"]={from,to,auto}. 기간 밖 날짜에는 시간표 수업이 생기지 않는다.
   auto: 그 반이 차시 계획을 모두 나가면, 마지막으로 기록한 수업 다음부터는 수업이 생기지 않는다. */
function spanKey(g,sj){return `${g}|${sj}`}

let finCache=null;
function classFinished(cls,g,sj){if(!finCache||finCache.v!==store.memoVer)finCache={v:store.memoVer,m:{}};const k=cls+"|"+sj;if(k in finCache.m)return finCache.m[k];
  const ps=plansFor(g,sj);let res=null;if(ps.length){const dn=doneBy(cls);if(ps.every(p=>dn.has(p.id))){let last="";Object.entries(L().logs).forEach(([kk,l])=>{if(l.cls===cls&&l.planId&&ps.some(p=>p.id===l.planId)){const d=logDate(kk);if(d>last)last=d}});res=last}}
  return finCache.m[k]=res}
/* 칸마다 정한 기간(lessons.ttSpan[요일|교시]={from,to})이 있으면 그게 먼저, 없으면 반별 → 학년별 기간 */
function cellSpan(k){return k?(L().ttSpan||{})[k]:null}

/* 입출고 기록: 상품 id와 창고(ds)·뽑기통(db)·복권(dl) 변화량을 함께 남겨서 정확히 되돌릴 수 있게 한다 */
function stockState(x){const t=(x.stock||0)+(x.box||0);if(t<=0)return"out";if(x.min!==""&&x.min!=null&&t<=+x.min)return"low";return"ok"}
function shopLog(item,kind,ds=0,db=0,dl=0){const n=item?ds+db:dl;S().log.unshift({t:Date.now(),id:item?item.id:"lotto",name:item?item.name:"긁는 복권",n:kind==="뽑기통 채움"?1:n,kind,ds,db,dl});S().log=S().log.slice(0,200)}
function undoShopLog(){
  const l=S().log[0];if(!l)return;
  if(l.dl!=null||l.ds!=null){
    if(l.id==="lotto"){if(S().lotto-(l.dl||0)<0){toast("되돌리면 복권 수가 0보다 작아져요");return}S().lotto-=(l.dl||0)}
    else{const x=S().items.find(z=>z.id===l.id);
      if(!x){toast("이 기록의 상품이 지워져서 되돌릴 수 없어요");S().log.shift();persist("core");render();return}
      if(l.kind==="새 상품"){
        if(x.stock!==(l.ds||0)||(x.box||0)!==(l.db||0)){toast("그 뒤로 수량이 바뀌어서 상품을 지울 수 없어요. 상품 창에서 지워 주세요");return}
        S().items=S().items.filter(z=>z.id!==x.id)}
      else{const ns=x.stock-(l.ds||0),nb=(x.box||0)-(l.db||0);if(ns<0||nb<0){toast("되돌리면 수량이 0보다 작아져요");return}x.stock=ns;x.box=nb}}
  }else{ /* 예전 형식 기록: 이름이 하나뿐일 때만 되돌린다 */
    if(l.name==="긁는 복권")S().lotto=Math.max(0,S().lotto-l.n);
    else{const xs=S().items.filter(z=>z.name===l.name);if(xs.length!==1){toast("같은 이름의 상품이 여럿이라 이 예전 기록은 되돌릴 수 없어요");return}const x=xs[0];
      if(l.kind==="뽑힘")x.box++;else if(l.kind==="뽑기통 채움"){if(x.box<1){toast("되돌리면 수량이 0보다 작아져요");return}x.box--;x.stock++}else if(l.kind!=="새 상품"){if(x.stock-l.n<0){toast("되돌리면 수량이 0보다 작아져요");return}x.stock-=l.n}}}
  S().log.shift();persist("core");toast("되돌렸어요");render();
}

function magSpend(y){return MG(y).items.filter(x=>num(x.price)&&x.paid).map(x=>({id:"mg-"+x.id,date:x.paid,item:"정기간행물",desc:`${x.name} 구독`,amount:x.price,other:false,mag:true}))}

function opsStats(y){const o=y.ops;const all=opsSpend(y);const mine=all.filter(s=>!s.other);
  const used=all.reduce((s,x)=>s+num(x.amount),0);return{used,remain:num(o.alloc)-used,mineUsed:mine.reduce((s,x)=>s+num(x.amount),0)}}
function spendChart(spend){
  const vals=AY_MONTHS.map(m=>spend.filter(s=>!s.other&&s.date&&P(s.date).getMonth()+1===m).reduce((a,s)=>a+num(s.amount),0));
  const W=640,H=200,L=16,R=16,T=26,Bt=28;const mx=Math.max(...vals,1);
  const x=i=>L+i*(W-L-R)/11,y=v=>T+(H-T-Bt)*(1-v/mx);
  const curM=ayOf(TODAY)===ui.ay?AY_MONTHS.indexOf(TODAY.getMonth()+1):11;
  const pts=vals.map((v,i)=>[x(i),y(v)]).slice(0,curM+1);
  const fmt=v=>v>=10000?(Math.round(v/1000)/10)+"만":v?v.toLocaleString("ko-KR"):"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="월별 지출" style="display:block;max-width:100%">
   ${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+(H-T-Bt)*f}" y2="${T+(H-T-Bt)*f}" stroke="var(--line)" stroke-width="1"/>`).join("")}
   ${pts.length>1?`<path d="M${pts.map(p=>p.join(",")).join(" L")} L${pts[pts.length-1][0]},${H-Bt} L${pts[0][0]},${H-Bt} Z" fill="var(--accent-soft)" opacity=".7"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(--accent)"/>${vals[i]?`<text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" fill="var(--fg2)" font-weight="700">${fmt(vals[i])}</text>`:""}`).join("")}
   ${AY_MONTHS.map((m,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--fg3)">${m}월</text>`).join("")}</svg>`;
}

function dutyTerm(){const k=`${ui.ay}-${ui.dterm}`;const t=SC().terms;t[k]=t[k]||{grid:{},pool:[]};return t[k]}

  if(m==="rota")return Array.from({length:SC().groups},(_,i)=>({k:String(i+1),label:`${i+1}조`}));return[]}

/* 독서교육 운영 실적: 탭 설정과 상관없이 원본 기록에서 집계 */
function eduStats(ay,untilToday){
  const from=`${ay}-03-01`,end=ymd(addD(new Date(ay+1,2,1),-1));const to=untilToday&&todayS<end?todayS:end;
  const norm=c=>String(c||"").replace(/\s+/g,"")||"(반 미입력)";
  const my={total:0,byCls:{}};for(let d=P(from);ymd(d)<=to;d=addD(d,1)){lessonsOn(ymd(d),true).forEach(x=>{my.total++;const k=x.cls||norm(x.text);my.byCls[k]=(my.byCls[k]||0)+1})}
  const occ=bookingOccurrences(ay).filter(o=>o.ds<=to);const byCls={},byT={};
  occ.forEach(o=>{const k=norm(o.b.cls);byCls[k]=byCls[k]||{n:0,coop:0};byCls[k].n++;if(o.b.coop){byCls[k].coop++;const t=o.b.teacher||"(선생님 미입력)";byT[t]=(byT[t]||0)+1}});
  const evs=core.events.filter(e=>{const s0=evRange(e)[0];return s0>=from&&s0<=to});
  const stu=evs.reduce((a,e)=>a+num(postOf(e).students),0);
  const logs=Object.entries(core.lessons.logs).filter(([k,l])=>{const d=k.split("|")[0];return d>=from&&d<=to&&l.planId}).length;
  return{from,to,my,occ,byCls,byT,coop:occ.filter(o=>o.b.coop).length,evs,stu,logs};
}

const CHG_K={up:"증액(추경)",down:"감액",move:"용도변경"};
function MG(y){y.mags=y.mags||{alloc:"",items:[],changes:[]};return y.mags}
function chgScope(y,sc){
  if(sc==="ops"){y.ops.changes=y.ops.changes||[];return{items:y.ops.items,total:()=>num(y.ops.alloc),addTotal:a=>{y.ops.alloc=String(num(y.ops.alloc)+a)},log:y.ops.changes,hasTotal:true}}

  y.bookChanges=y.bookChanges||[];return{items:y.books,total:()=>y.books.reduce((s,r)=>s+num(r.alloc),0),addTotal:()=>{},log:y.bookChanges,hasTotal:false};

function applyChg(S,c,sign){const it=id=>S.items.find(i=>i.id===id);const a=num(c.amount)*sign;
  if(c.kind==="move"){const f=it(c.from),t=it(c.to);if(f)f.alloc=String(num(f.alloc)-a);if(t)t.alloc=String(num(t.alloc)+a);return}
  const d=c.kind==="up"?a:-a;if(S.hasTotal)S.addTotal(d);const t=it(c.item);if(t)t.alloc=String(num(t.alloc)+d);}
function chgText(S,c){const nm=id=>{const i=S.items.find(x=>x.id===id);return i?esc(i.name):"(지운 항목)"};
  if(c.kind==="move")return `${nm(c.from)} → ${nm(c.to)} <b class="num">${won(c.amount)}</b>`;
  return `<b class="num">${c.kind==="up"?"+":"−"}${won(c.amount)}</b>${c.item?` · ${nm(c.item)}`:" · 총액"}`}

function bindChangeLog(v,y){

/* ===== 엑셀(CSV) 내보내기 ===== */
async function saveCSV(name,rows){
  try{await loadXLSX();const ws=XLSX.utils.aoa_to_sheet(rows);const w=[];
    rows.forEach(r=>{if(!r||r.length<2)return;r.forEach((v,i)=>{const l=[...String(v??"")].reduce((a,ch)=>a+(ch.charCodeAt(0)>255?2:1),0);w[i]=Math.max(w[i]||6,Math.min(50,l+2))})});ws["!cols"]=w.map(x=>({wch:x||8}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,String(name).replace(/[\\/?*\[\]:]/g,"").slice(0,30)||"Sheet1");const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    return downloadFile(`${name}_${todayS}.xlsx`,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}catch(e){console.warn("xlsx",e)}
  const cell=v=>{const t=String(v??"");return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t};
  const csv="﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  await downloadFile(`${name}_${todayS}.csv`,new Blob([csv],{type:"text/csv;charset=utf-8"}));
}
function csvBtn(kind,label){return `<button type="button" class="btn line sm" data-csv="${kind}">⬇ ${label||"엑셀로 받기"}</button>`}

async function loadAllJournals(){
  try{
    if(store.mode==="db"){const q=await store.db.collection("data/users/"+store.uid).get();q.docs.forEach(x=>{if(x.id.startsWith("j-")){const k=x.id.slice(2);if(!journals[k])journals[k]=Object.assign({days:{}},JSON.parse(JSON.stringify(x.data())))}})}
    else{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("hb-j-")){const m=k.slice(5);if(!journals[m])journals[m]=JSON.parse(localStorage.getItem(k))}}}
  }catch(e){}
}
function searchAll(q){
  const Q=q.trim().toLowerCase();if(!Q)return[];const out=[];
  const hit=(...v)=>v.some(x=>x&&String(x).toLowerCase().includes(Q));
  const snip=t=>{t=String(t||"");const i=t.toLowerCase().indexOf(Q);if(i<0)return"";const a=Math.max(0,i-18);return(a?"…":"")+t.slice(a,i+Q.length+30).replace(/\s+/g," ")+(i+Q.length+30<t.length?"…":"")};
  const add=(g,title,sub,go)=>out.push({g,title,sub,go});
  const goTab=(tab,extra)=>()=>{closeModal();ui.tab=tab;extra&&extra();saveUI();render()};
  core.events.forEach(e=>{if(hit(e.name,e.content,e.result,e.prize,e.material))add("행사",e.name,`${evWhen(e)} ${snip(e.content)||snip(e.result)||snip(e.prize)}`,()=>{closeModal();ui.tab="ev";ui.evSub="ev";ui.ay=ayOf(P(e.start));render();openEvent(e)})});
  core.promos.forEach(p=>{if(hit(p.name,p.memo))add("홍보물",p.name,p.date?md(p.date):"",()=>{closeModal();ui.tab="ev";ui.evSub="promo";ui.ay=ayOf(P(p.date));render();openPromo(p)})});
  core.settings.programs.forEach(pg=>Object.entries(core.pmonths[pg.id]||{}).forEach(([k,x])=>{if(hit(x.content,x.prize,x.result))add("월간 프로그램",`${+k.slice(5)}월 ${pg.name}`,snip(x.content)||snip(x.prize)||snip(x.result),()=>{closeModal();ui.tab="ev";ui.evSub="prog";ui.ay=ayOf(P(k+"-01"));render();openPM(pg.id,k)})}));
  Object.entries(core.monthTodos).forEach(([k,arr])=>arr.forEach(t=>{if(hit(t.text))add("이번 달에 꼭 챙길 것",t.text,`${k.slice(0,4)}년 ${+k.slice(5)}월`,goTab("cal",()=>{ui.calMonth=k}))}));
  core.yearly.forEach(t=>{if(hit(t.text))add("매년 반복",t.text,`매년 ${t.month}월`,goTab("cal",()=>{ui.calMonth=ym(ayMonthDate(ui.ay,t.month))}))});
  Object.entries(core.calMemos).forEach(([ds,arr])=>arr.forEach(m=>{if(hit(m.text))add("캘린더 메모",m.text,md(ds),goTab("cal",()=>{ui.calMonth=ds.slice(0,7)}))}));
  core.yearMemos.forEach(m=>{if(hit(m.text))add("내년의 나에게",m.text,m.month?m.month+"월":"언제든",goTab("memo",()=>{ui.memoSub="yearly"}))});
  if(hit(core.freeMemo))add("자유 메모",snip(core.freeMemo),"",goTab("memo",()=>{ui.memoSub="free"}));
  Object.entries(journals).forEach(([mk,j])=>Object.entries(j.days||{}).forEach(([ds,d])=>{(d.tasks||[]).forEach(t=>{if(hit(t.text))add("업무일지",t.text,`${md(ds)}${t.status==="done"?" · 완료":""}`,goTab("journal",()=>{ui.jMonth=ds.slice(0,7);ui.jDate=ds;ui.ay=ayOf(P(ds))}))});
    if(hit(d.memo))add("업무일지 메모",snip(d.memo),md(ds),goTab("journal",()=>{ui.jMonth=ds.slice(0,7);ui.jDate=ds}))}));
  const Ls=core.lessons;
  Ls.plans.forEach(p=>{if(hit(p.title,p.goal,p.content,p.mats,p.common,...Object.values(p.notes||{})))add("차시 계획",`${p.grade}학년 ${p.subj} ${p.no}차시 ${p.title}`,snip(p.goal)||snip(p.content)||snip(p.mats),()=>{closeModal();ui.tab="lesson";ui.lsub="plan";ui.lgrade=p.grade;ui.lsubj=p.subj;render();openPlan(p)})});
  Ls.bookings.forEach(b=>{if(hit(b.cls,b.subject,b.teacher,b.topic,b.books,b.memo))add("도서관 이용",`${b.cls} ${b.subject} ${b.teacher}`.trim(),`${b.repeat?"매주 "+WD[P(b.date).getDay()]:md(b.date)} ${b.period} ${b.topic||""}`,()=>{closeModal();ui.tab="lesson";ui.lsub="lib";render();openBooking(b)})});
  [...Ls.files,...Ls.plans.flatMap(p=>p.links||[])].forEach(f=>{if(hit(f.name,f.url))add("자료함",f.name||f.url,"",goTab("lesson",()=>{ui.lsub="files"}))});
  Object.entries(Ls.calNotes).forEach(([ds,t])=>{if(hit(t))add("수업 달력 메모",t,md(ds),goTab("lesson",()=>{ui.lsub="cal";ui.lcal=ds.slice(0,7)}))});
  core.booklists.items.forEach(x=>{if(hit(x.title,x.call,x.memo))add("교과별 도서목록",x.title,`${x.subj} · ${x.grade}${x.call?" · "+x.call:""}`,goTab("memo",()=>{ui.memoSub="books";ui.blsubj=x.subj}))});
  core.info.entries.forEach(e=>{if(hit(e.label,e.group)||(!e.secret&&hit(e.value)))add("기본 정보",e.label,e.group+(e.secret?"":" · "+e.value),goTab("info",()=>{ui.isub="basic"}))});
  if(hit(core.info.rule.body))add("운영규정",snip(core.info.rule.body),"",goTab("info",()=>{ui.isub="rule"}));
  (core.info.docs||[]).forEach(x=>{if(hit(x.title,x.from,x.no,x.cat,x.memo,...(x.files||[]).map(f=>f.name)))add("공문·지침",x.title,`${x.date?md(x.date):""} ${x.from||""} ${snip(x.memo)}`,()=>{closeModal();ui.tab="info";ui.isub="docs";render();openDoc(x)})});
  core.info.meetings.forEach(m=>{if(hit(m.title,m.attend,m.agenda,m.decide,m.todo))add("회의록",m.title||"회의",`${m.date?md(m.date):""} ${snip(m.decide)||snip(m.agenda)}`,()=>{closeModal();ui.tab="info";ui.isub="meet";render();openMeeting(m)})});
  core.info.laws.forEach(l=>{if(hit(l.name,l.memo))add("법적근거",l.name,snip(l.memo),goTab("info",()=>{ui.isub="law"}))});
  const Sh=core.shop;
  Sh.cart.forEach(x=>{if(hit(x.name))add("장바구니",x.name,x.bought?"산 것":"살 것",goTab("shop",()=>{ui.ssub="cart"}))});
  Sh.items.forEach(x=>{if(hit(x.name))add("상품",x.name,`창고 ${x.stock}`,goTab("shop",()=>{ui.ssub="items"}))});
  Sh.gear.forEach(x=>{if(hit(x.name,x.loc,x.memo))add("비품",x.name,`${x.qty}개 · ${x.loc||""}`,goTab("shop",()=>{ui.ssub="gear"}))});
  Object.entries(core.budget.years||{}).forEach(([yr,y])=>{yr=+yr;
    (y.ops.spend||[]).forEach(x=>{if(hit(x.desc,x.item))add("도서관운영비 품의",x.desc||x.item,`${x.date?md(x.date):""} · ${won(x.amount)}`,goTab("budget",()=>{ui.bsub="ops";ui.ay=yr}))});
    [...(y.ops.changes||[]),...(y.bookChanges||[]),...((y.mags||{}).changes||[])].forEach(c=>{if(hit(c.memo))add("예산 변경",c.memo,`${c.date?md(c.date):""} · ${CHG_K[c.kind]} ${won(c.amount)}`,goTab("budget",()=>{ui.bsub="ops";ui.ay=yr}))});
    (y.books||[]).forEach(r=>{if(hit(r.name))add("도서구입비",r.name,`${yr}학년도`,goTab("budget",()=>{ui.bsub="books";ui.ay=yr}))});
    ((y.mags||{}).items||[]).forEach(r=>{if(hit(r.name,r.memo))add("정기간행물",r.name,`${yr}학년도 · ${won(r.price)}`,goTab("budget",()=>{ui.bsub="mags";ui.ay=yr}))});
    (y.ext||[]).forEach(x=>{if(hit(x.name,x.source,...x.lines.map(l=>l.name)))add("외부 예산",x.name,`${yr}학년도 ${x.source||""}`,goTab("budget",()=>{ui.bsub="ext";ui.ay=yr}))});});
  const Sc=core.school;
  Sc.members.forEach(m=>{if(hit(m.name,m.cls,m.role))add("도서부",m.name,`${m.cls} ${m.role}`,goTab("school",()=>{ui.scsub="duty"}))});
  Object.entries(Sc.homerooms).forEach(([k,v])=>{if(hit(v,k))add("담임",`${k} ${v}`,"",goTab("school",()=>{ui.scsub="home"}))});
  if(hit(Sc.club))add("동아리 메모",snip(Sc.club),"",goTab("school",()=>{ui.scsub="club"}));
  return out;
}
function openSearch(){
  const m=modal("검색",`<input id="sq" type="search" placeholder="행사, 할 일, 메모, 책 제목, 선생님 이름…" autocomplete="off" aria-label="검색어"><div id="sres" class="stack" style="gap:6px"><span class="small faint">두 글자 이상 적어 보세요. 모든 탭의 내용을 찾아요.</span></div>`,`<span class="small faint">PC에서는 / 키로 바로 열려요.</span><span class="sp"></span><button class="btn ghost" data-close type="button">닫기</button>`,true);
  const box=$("#sres",m);let tm,last=[];
  loadAllJournals();
  const run=()=>{const q=$("#sq",m).value;if(q.trim().length<2){box.innerHTML=`<span class="small faint">두 글자 이상 적어 보세요. 모든 탭의 내용을 찾아요.</span>`;return}
    last=searchAll(q);const mk=t=>{const e=esc(t);const qq=esc(q.trim());return qq?e.replace(new RegExp(qq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),x=>`<mark>${x}</mark>`):e};
    box.innerHTML=last.length?`<span class="small faint">${last.length}개 찾음${last.length>100?" · 앞의 100개만 보여요":""}</span>`+last.slice(0,100).map((r,i)=>`<button type="button" class="pick sres" data-sr="${i}" style="flex-direction:column;align-items:flex-start;gap:1px"><span class="small faint">${esc(r.g)}</span><span>${mk(r.title)}</span>${r.sub?`<span class="small muted">${mk(r.sub)}</span>`:""}</button>`).join(""):`<span class="empty">찾는 내용이 없어요.</span>`};
  m.addEventListener("input",e=>{if(e.target.id==="sq"){clearTimeout(tm);tm=setTimeout(run,150)}});
  m.addEventListener("click",e=>{const b=e.target.closest("[data-sr]");if(b){const r=last[+b.dataset.sr];r&&r.go()}});
  setTimeout(()=>{const i=$("#sq",m);i&&i.focus()},30);
}

let pendingImport=null;
async function buildBackup(){await loadAllJournals();return{app:"함박꽃북토리 교무수첩",version:2,exportedAt:new Date().toISOString(),core:JSON.parse(JSON.stringify(core)),journals:JSON.parse(JSON.stringify(journals))}}
async function downloadFile(filename,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  if(store.downloads){try{await store.downloads.save({filename,data:blob});return true}catch(e){toast("내려받기를 취소했어요");return false}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}
  catch(e){toast("이 화면에서는 파일을 내려받을 수 없어요");return false}
}
async function exportBackup(){const out=await buildBackup();
  if(ui.bkNoStu){const ls=out.core.lessons||{};Object.values(ls.roster||{}).forEach(r=>r.forEach(x=>x.name=""));Object.keys(ls.logs||{}).forEach(k=>{const l=ls.logs[k];delete l.att;delete l.notes;if(!l.planId)delete ls.logs[k]})}const ok=await downloadFile(`교무수첩_백업_${todayS}.json`,JSON.stringify(out),"application/json");
  if(ok){core.lastBackup=Date.now();persist("core");toast("백업 파일을 내려받았어요")}return ok}
function bkSummary(c,js){const days=Object.values(js||{}).reduce((a,j)=>a+Object.keys(j.days||{}).filter(k=>(j.days[k].tasks||[]).length||j.days[k].memo).length,0);

function showImportAsk(o,fname){

/* ===== 자동 준비 할 일 다시 맞추기 =====
   행사 날짜·준비 항목·며칠 전 설정이 바뀌면, 아직 손대지 않은 자동 할 일만 새 날짜로 옮기거나 정리한다.
   손댄 할 일(완료·미룸·취소 표시, 시간 지정, 분류 변경)은 그대로 둔다. */
function autoTouched(t){return !!(t.status||t.block||(t.cat&&t.cat!=="행사"))}
async function resyncAuto(){
  if(store.mode==="loading"||store.resyncBusy)return;store.resyncBusy=true;store.resyncing=true;
  try{
    const sent=core.autoSent||{};const tg={};autoTargets().forEach(t=>tg[t.key]=t);
    const win=[0,1,2].map(i=>ym(new Date(TODAY.getFullYear(),TODAY.getMonth()+i,1)));
    let changed=0;
    for(const [key,placed] of Object.entries(sent)){
      if(key.startsWith("P:")&&!win.includes(key.split(":")[2]))continue;
      const t=tg[key];
      if(t){const want=t.target>=todayS?t.target:(placed<todayS?placed:todayS);if(want===placed)continue}   // 있어야 할 자리면 그대로 (지난 기한은 오늘로)
      await loadJournal(placed.slice(0,7));const d=jday(placed);if(!d)continue;
      const i=d.tasks.findIndex(x=>x.akey===key||(!x.akey&&d.auto.includes(key)&&t&&x.text===t.text));
      const task=i>=0?d.tasks[i]:null;
      if(task&&autoTouched(task))continue;                   // 손댄 할 일은 건드리지 않음
      if(task)d.tasks.splice(i,1);
      d.auto=d.auto.filter(k=>k!==key);delete sent[key];changed++;persist("j-"+placed.slice(0,7));
    }
    if(changed){persist("core");render()}
  }finally{store.resyncBusy=false;store.resyncing=false}
}
/* 도서관 이용 실적: 탭 설정과 상관없이 원본 예약에서 센다.
   하루 예약 = 날짜와 상관없이 1번 / 매주 반복 = 기간 안의 근무일마다 1번 (같은 예약·같은 날은 한 번만) */
function occurrencesOf(b,from,to){const out=[];
  if(!b.repeat){if(b.date>=from&&b.date<=to)out.push(b.date);return out}
  const end=[b.until||`${ayOf(P(b.date))+1}-02-28`,to].sort()[0];let d=P(b.date>from?b.date:from);
  const wd=P(b.date).getDay();while(d.getDay()!==wd)d=addD(d,1);
  for(;ymd(d)<=end;d=addD(d,7)){const ds=ymd(d);if(ds>=b.date&&isWork(d)&&!(b.skip||{})[ds])out.push(ds)}return out}
/* 같은 날짜·교시에 겹치는 다른 예약 */
function bookingConflicts(b){const mine=occurrencesOf(b,"0000-01-01","9999-12-31");if(!mine.length)return[];const set=new Set(mine);const from=mine[0],to=mine[mine.length-1];const out=[];
  core.lessons.bookings.forEach(o=>{if(o.id===b.id||o.period!==b.period)return;occurrencesOf(o,from,to).forEach(ds=>{if(set.has(ds))out.push({ds,b:o})})});
  return out.sort((x,y)=>x.ds<y.ds?-1:1)}
function bookingOccurrences(ay){
  const from=`${ay}-03-01`,to=ymd(addD(new Date(ay+1,2,1),-1));const out=[];
  core.lessons.bookings.forEach(b=>occurrencesOf(b,from,to).forEach(ds=>out.push({ds,b})));
  return out.sort((a,c)=>a.ds<c.ds?-1:a.ds>c.ds?1:perIdx(a.b.period)-perIdx(c.b.period));
}

    d.tasks=(d.tasks||[]).filter(t=>{if(t.lkey&&!t.status&&!valid.has(t.lkey)){ch=true;d.auto=(d.auto||[]).filter(k=>k!==t.lkey);return false}return true});
    d.auto=(d.auto||[]).filter(k=>!k.startsWith("L:")||valid.has(k)||d.tasks.some(t=>t.lkey===k));
    if(ch)persist("j-"+mk)}));
}
