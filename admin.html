<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>도서관 활동 안내 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#20262B; --soft:#5B6570; --paper:#FAF7F1; --card:#fff; --line:#E5E0D3;
    --teal:#1F4B43; --teal-deep:#153933; --mustard:#D9A441; --rose:#B0524A; --ok:#2E7D5B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;font-size:14px;line-height:1.5;}
  header{position:sticky;top:0;z-index:20;background:var(--teal);color:#F5F1E6;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  header h1{font-size:17px;margin:0 12px 0 0;color:#fff;}
  header .status{font-size:12.5px;color:#CFDAD3;flex:1;min-width:200px;}
  header .status b{color:#fff;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:#F3EFE6;}
  .btn.primary{background:var(--mustard);border-color:var(--mustard);color:#20262B;font-weight:700;}
  .btn.primary:hover{filter:brightness(.95);}
  .btn.danger{color:var(--rose);}
  .btn.small{padding:3px 8px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .layout{display:flex;max-width:1400px;margin:0 auto;}
  nav{width:190px;flex:none;padding:18px 10px;position:sticky;top:58px;align-self:flex-start;}
  nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--soft);}
  nav button.active{background:#fff;color:var(--teal-deep);font-weight:700;box-shadow:0 1px 0 var(--line);}
  nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rose);margin-left:6px;vertical-align:middle;visibility:hidden;}
  nav button.dirty .dot{visibility:visible;}
  main{flex:1;min-width:0;padding:18px 20px 80px;}
  .page{display:none;} .page.active{display:block;}
  h2{font-size:19px;color:var(--teal-deep);margin:0 0 4px;}
  .lead{color:var(--soft);margin:0 0 16px;font-size:13px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--teal-deep);}
  .field{margin-bottom:12px;}
  .field > label{display:block;font-weight:600;font-size:13px;margin-bottom:4px;}
  .field .hint{font-size:12px;color:var(--soft);margin-top:3px;}
  input[type=text],input[type=url],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13.5px;background:#fff;}
  textarea{min-height:64px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:2px solid #9CC3B6;border-color:#9CC3B6;}
  .check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;}
  .check input{width:16px;height:16px;}
  .list-item{border:1px dashed var(--line);border-radius:10px;padding:10px 12px 2px;margin-bottom:8px;background:#FDFCF9;}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--soft);}
  .list-head .tools{display:flex;gap:4px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:8px;}
  .photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .photo img{width:100%;height:120px;object-fit:cover;display:block;background:#EEE;}
  .photo .pbody{padding:8px;}
  .photo .pbody input{margin-bottom:6px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
  .toolbar input[type=text]{max-width:280px;}
  .toolbar .grow{flex:1;}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh;}
  table.ed{border-collapse:collapse;font-size:12.5px;min-width:100%;}
  table.ed th{position:sticky;top:0;background:#F1ECE1;z-index:1;text-align:left;padding:7px 6px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);}
  table.ed td{padding:3px 4px;border-bottom:1px solid #F0EBE0;vertical-align:top;}
  table.ed td input[type=text],table.ed td input[type=number],table.ed td select,table.ed td textarea{padding:4px 6px;font-size:12.5px;border-radius:5px;}
  table.ed td input[type=number]{width:62px;}
  table.ed td textarea{min-height:30px;height:30px;}
  table.ed tr.hl td{background:#FFF6DD;}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;}
  .note{background:#FFF8E6;border:1px solid #F0DFAF;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .note.ok{background:#EAF5EE;border-color:#BFDCC9;}
  .note.warn{background:#FBECEA;border-color:#EBC4BF;}
  .help h3{margin-top:18px;}
  .help ol,.help ul{padding-left:20px;margin:6px 0;}
  .help li{margin:4px 0;}
  .help code{background:#F1ECE1;padding:1px 5px;border-radius:4px;font-size:12.5px;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;display:none;z-index:50;max-width:90vw;}
  dialog{border:1px solid var(--line);border-radius:12px;max-width:640px;width:92vw;padding:18px 20px;}
  dialog::backdrop{background:rgba(0,0,0,.3);}
  dialog h3{margin:0 0 10px;color:var(--teal-deep);}
  dialog .body{max-height:60vh;overflow:auto;font-size:13px;}
  dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  @media (max-width:800px){
    .layout{flex-direction:column;} nav{width:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:10px;}
    nav button{width:auto;} .row2,.row3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <h1>📚 도서관 활동 안내 · 관리</h1>
  <div class="status" id="status">불러오는 중…</div>
  <button class="btn" id="btnFolder">📁 사이트 폴더 연결</button>
  <button class="btn" id="btnPreview">👁 사이트 미리보기</button>
  <button class="btn primary" id="btnSave" disabled>💾 저장</button>
</header>

<div class="layout">
  <nav id="nav">
    <button data-page="basic" class="active">기본 정보<span class="dot"></span></button>
    <button data-page="event">독서행사 신청<span class="dot"></span></button>
    <button data-page="lectures">작가와의 만남<span class="dot"></span></button>
    <button data-page="reading">낭독극<span class="dot"></span></button>
    <button data-page="onchaek">온책읽기 목록<span class="dot"></span></button>
    <button data-page="help">사용법</button>
  </nav>
  <main>
    <div id="globalNote"></div>
    <section class="page active" id="page-basic"></section>
    <section class="page" id="page-event"></section>
    <section class="page" id="page-lectures"></section>
    <section class="page" id="page-reading"></section>
    <section class="page" id="page-onchaek"></section>
    <section class="page help" id="page-help"></section>
  </main>
</div>

<div id="toast"></div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div class="body" id="dlgBody"></div><div class="foot" id="dlgFoot"></div></dialog>

<!-- 현재 데이터 (폴더를 연결하면 폴더의 파일로 다시 읽어요) -->
<script src="data/site.js"></script>
<script src="data/lectures.js"></script>
<script src="data/readings.js"></script>
<script src="data/onchaek.js"></script>
<script>
/* =====================================================================
   데이터 파일 정의
   ===================================================================== */
const FILES = {
  site:     {path:'data/site.js',     varName:'SITE',     comment:'사이트 문구·링크·사진 설정'},
  lectures: {path:'data/lectures.js', varName:'LECTURES', comment:'작가와의 만남 강연 목록 (p=출판사, a=작가, b=도서명, l=강연명, t=대상, f=강연방식, s=주제, u=링크, img=표지)'},
  readings: {path:'data/readings.js', varName:'READINGS', comment:'낭독극 작품 목록 (책을 읽어 주는 사람들)'},
  onchaek:  {path:'data/onchaek.js',  varName:'ONCHAEK',  comment:'온책읽기 도서 목록 (reg=DLS 등록권수, unreg=미등록권수, avail=대출가능, out=대출중, lost=소재불명, damaged=파손/가치상실, planned=구매예정)'}
};
const PAGE_FILES = {basic:['site'], event:['site'], lectures:['site','lectures'], reading:['site','readings'], onchaek:['site','onchaek']};

let DATA = {
  site: clone(window.SITE || {}),
  lectures: clone(window.LECTURES || []),
  readings: clone(window.READINGS || []),
  onchaek: clone(window.ONCHAEK || {dlsDate:'', books:[]})
};
const dirty = new Set();
let dirHandle = null;
const pendingImages = {};   // 새로 추가한 사진 (폴더 미연결 시 저장할 때 내려받기)
const objectUrls = {};      // 미리보기용

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==='class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='html') e.innerHTML = v;
    else if(v!==undefined && v!==null && v!==false) e.setAttribute(k, v===true?'':v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c instanceof Node ? c : document.createTextNode(c)); });
  return e;
}
function toast(msg, ms){
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', ms||2600);
}
function showDialog(title, bodyHtml, buttons){
  return new Promise(res=>{
    const d = document.getElementById('dlg');
    document.getElementById('dlgTitle').textContent = title;
    document.getElementById('dlgBody').innerHTML = bodyHtml;
    const foot = document.getElementById('dlgFoot'); foot.innerHTML='';
    (buttons||[{label:'확인',value:true,primary:true}]).forEach(b=>{
      foot.append(el('button',{class:'btn'+(b.primary?' primary':''), onclick:()=>{ d.close(); res(b.value); }}, b.label));
    });
    d.showModal();
  });
}
function markDirty(file){
  dirty.add(file);
  document.getElementById('btnSave').disabled = false;
  document.querySelectorAll('#nav button').forEach(b=>{
    const files = PAGE_FILES[b.dataset.page]||[];
    // 사이트 설정은 여러 화면에 걸쳐 있으므로 현재 화면만 표시
    if(files.includes(file) && (file!=='site' || b.classList.contains('active'))) b.classList.add('dirty');
  });
  updateStatus();
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* =====================================================================
   폴더 연결 · 읽기 · 저장
   ===================================================================== */
const HAS_FS = 'showDirectoryPicker' in window;

function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('libAdmin',1);
    r.onupgradeneeded = ()=>r.result.createObjectStore('kv');
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function idbSet(k,v){ try{ const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').put(v,k); }catch(e){} }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }

async function getFile(path){
  const parts = path.split('/'); let d = dirHandle;
  for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i]);
  return d.getFileHandle(parts[parts.length-1]);
}
async function writeFile(path, content){
  const parts = path.split('/'); let d = dirHandle;
  for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i], {create:true});
  const fh = await d.getFileHandle(parts[parts.length-1], {create:true});
  const w = await fh.createWritable(); await w.write(content); await w.close();
}
function parseDataFile(text){
  const m = text.match(/window\.\w+\s*=\s*/);
  if(!m) throw new Error('데이터 파일 형식이 아니에요');
  const body = text.slice(m.index + m[0].length).trim().replace(/;\s*$/,'');
  return JSON.parse(body);
}
function serialize(key){
  const f = FILES[key], v = DATA[key];
  const line = o => JSON.stringify(o);
  let json;
  if(Array.isArray(v)) json = '[\n' + v.map(line).join(',\n') + '\n]';
  else if(key==='onchaek') json = '{\n"dlsDate": '+JSON.stringify(v.dlsDate||'')+',\n"books": [\n'+(v.books||[]).map(line).join(',\n')+'\n]\n}';
  else json = JSON.stringify(v, null, 2);
  return `// ${f.comment}\n// 이 파일은 관리자 페이지(admin.html)에서 수정하세요.\nwindow.${f.varName} = ${json};\n`;
}

async function useFolder(handle, silent){
  try{
    await handle.getFileHandle('index.html');
    await handle.getDirectoryHandle('data');
  }catch(e){
    if(!silent) showDialog('폴더를 확인해 주세요', '<p>선택한 폴더에 <code>index.html</code>과 <code>data</code> 폴더가 없어요.<br>사이트 폴더(<b>Documents\\GitHub\\8310</b>)를 선택해 주세요.</p>');
    return false;
  }
  dirHandle = handle;
  await idbSet('dir', handle);
  // 폴더의 최신 파일로 다시 읽기
  for(const key in FILES){
    try{
      const fh = await getFile(FILES[key].path);
      DATA[key] = parseDataFile(await (await fh.getFile()).text());
    }catch(e){ console.warn('읽기 실패', key, e); }
  }
  dirty.clear();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('dirty'));
  renderAll();
  updateStatus();
  if(!silent) toast('사이트 폴더를 연결했어요');
  return true;
}
async function connectFolder(){
  if(!HAS_FS){
    showDialog('이 브라우저는 폴더 연결을 지원하지 않아요', '<p><b>크롬</b>이나 <b>엣지</b>에서 열면 저장 버튼 한 번으로 폴더에 바로 저장돼요.</p><p>지금 브라우저에서 저장하면 수정된 파일이 <b>다운로드</b>되니, 사이트 폴더의 <code>data</code> 폴더에 덮어쓰기 해 주세요.</p>');
    return;
  }
  if(dirty.size){
    const ok = await showDialog('저장하지 않은 수정이 있어요', '<p>폴더를 연결하면 폴더의 파일을 다시 불러와서, 지금까지 저장하지 않은 수정은 사라져요. 계속할까요?</p>', [{label:'취소',value:false},{label:'계속',value:true,primary:true}]);
    if(!ok) return;
  }
  try{
    const saved = await idbGet('dir');
    if(saved){
      const p = await saved.requestPermission({mode:'readwrite'});
      if(p==='granted' && await useFolder(saved)) return;
    }
    const h = await window.showDirectoryPicker({id:'lib-site', mode:'readwrite'});
    await useFolder(h);
  }catch(e){ if(e.name!=='AbortError') showDialog('폴더 연결 실패', '<p>'+esc(e.message)+'</p>'); }
}
async function save(){
  if(!dirty.size && !Object.keys(pendingImages).length){ toast('바뀐 내용이 없어요'); return; }
  if(dirty.has('site')) DATA.site.site = DATA.site.site || {};
  const files = [...dirty];
  if(dirHandle){
    try{
      for(const name in pendingImages){ await writeFile('images/'+name, pendingImages[name]); delete pendingImages[name]; }
      for(const key of files) await writeFile(FILES[key].path, serialize(key));
    }catch(e){
      showDialog('저장 실패', '<p>'+esc(e.message)+'</p><p>폴더 연결 버튼을 다시 눌러 권한을 허용해 주세요.</p>'); return;
    }
    dirty.clear();
    document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('dirty'));
    document.getElementById('btnSave').disabled = true;
    updateStatus();
    showDialog('저장했어요 ✅', `<p>저장한 파일: ${files.map(k=>'<code>'+FILES[k].path+'</code>').join(', ')}</p>
      <p><b>이제 사이트에 올리기</b>: GitHub Desktop을 열고 → 왼쪽 아래 Summary에 메모(예: <i>온책읽기 목록 갱신</i>) 입력 → <b>Commit to main</b> → 위쪽 <b>Push origin</b>.<br>1~2분 뒤 사이트에 반영돼요.</p>`);
  } else {
    for(const name in pendingImages){ download(name, pendingImages[name]); }
    for(const key of files){ download(FILES[key].path.split('/').pop(), new Blob([serialize(key)],{type:'text/javascript'})); }
    showDialog('파일을 내려받았어요', `<p>내려받은 파일을 사이트 폴더에 덮어써 주세요.</p><ul>
      ${files.map(k=>'<li><code>'+FILES[k].path.split('/').pop()+'</code> → <code>'+FILES[k].path+'</code></li>').join('')}
      ${Object.keys(pendingImages).map(n=>'<li><code>'+n+'</code> → <code>images/'+n+'</code></li>').join('')}</ul>
      <p>다음부터는 <b>📁 사이트 폴더 연결</b>을 해 두면 바로 저장돼요.</p>`);
    dirty.clear(); Object.keys(pendingImages).forEach(k=>delete pendingImages[k]);
    document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('dirty'));
    document.getElementById('btnSave').disabled = true; updateStatus();
  }
}
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function updateStatus(){
  const s = document.getElementById('status');
  const folder = dirHandle ? `폴더 연결됨: <b>${esc(dirHandle.name)}</b>` : '폴더 미연결 (저장 시 파일 다운로드)';
  const ch = dirty.size ? ` · <b>저장 안 된 수정 있음</b>` : '';
  s.innerHTML = folder + ch;
}
window.addEventListener('beforeunload', e=>{ if(dirty.size){ e.preventDefault(); e.returnValue=''; } });

/* =====================================================================
   폼 만들기 도우미
   ===================================================================== */
// def: {key, label, type:'text'|'textarea'|'url'|'date'|'bool'|'list'|'strlist'|'photos', hint, fields(list용), file}
function field(obj, def, file){
  const wrap = el('div',{class:'field'});
  const set = v => { obj[def.key] = v; markDirty(file); };
  if(def.type==='bool'){
    const cb = el('input',{type:'checkbox', onchange:e=>set(e.target.checked)}); cb.checked = obj[def.key]!==false;
    wrap.append(el('label',{class:'check'}, cb, def.label));
  } else if(def.type==='list'){
    wrap.append(el('label',{}, def.label));
    const box = el('div');
    const render = ()=>{
      box.innerHTML='';
      const arr = obj[def.key] = obj[def.key] || [];
      arr.forEach((item,i)=>{
        const it = el('div',{class:'list-item'});
        it.append(el('div',{class:'list-head'}, `${i+1}번째`, el('span',{class:'tools'},
          el('button',{class:'btn small', title:'위로', onclick:()=>{ if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; markDirty(file); render(); } }},'▲'),
          el('button',{class:'btn small', title:'아래로', onclick:()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; markDirty(file); render(); } }},'▼'),
          el('button',{class:'btn small danger', onclick:()=>{ if(confirm('삭제할까요?')){ arr.splice(i,1); markDirty(file); render(); } }},'삭제'))));

  } else if(def.type==='photos'){

function photoEditor(obj, key, file){

      const fit = el('input',{type:'checkbox', onchange:e=>{ p.fit = e.target.checked?'contain':''; markDirty(file); }}); fit.checked = p.fit==='contain';

        el('div',{class:'tools', style:'display:flex;gap:4px;margin-top:4px'},
          el('button',{class:'btn small', onclick:()=>{ if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; markDirty(file); render(); } }},'◀'),
          el('button',{class:'btn small', onclick:()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; markDirty(file); render(); } }},'▶'),
          el('button',{class:'btn small danger', onclick:()=>{ if(confirm('이 사진을 사이트에서 뺄까요? (사진 파일은 images 폴더에 그대로 남아요)')){ arr.splice(i,1); markDirty(file); render(); } }},'빼기')))));
    });
    box.append(grid);
    const fi = el('input',{type:'file', accept:'image/*', multiple:true, style:'display:none', onchange:async e=>{
      for(const f of e.target.files){
        const blob = await resizeImage(f, 1200);
        const name = 'photo-'+Date.now()+'-'+Math.floor(Math.random()*1000)+'.jpg';
        pendingImages[name] = blob; objectUrls['images/'+name] = URL.createObjectURL(blob);
        arr.push({src:'images/'+name, alt:'', fit:''});
      }
      markDirty(file); render();
      toast('사진을 추가했어요. 저장을 눌러야 반영돼요.');
    }});
    box.append(el('button',{class:'btn small', onclick:()=>fi.click()}, '+ 사진 추가'), fi);
    box.append(el('div',{class:'hint'}, '사진은 자동으로 줄여서 저장돼요. 학생 얼굴이 알아볼 수 있게 나온 사진은 공개 사이트에 올리지 않는 게 좋아요.'));
  };
  render();
  return box;
}
function resizeImage(file, max){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(Math.max(w,h) > max){ const r = max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b),'image/jpeg',0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

// cols: {key,label,type:'text'|'num'|'bool'|'select'|'long',options,width}
function tableEditor(opts){
  const {getRows, cols, file, pageSize=40, newRow, searchKeys, onChange} = opts;
  const root = el('div');
  let page = 1, q = '', highlight = new Set();
  const search = el('input',{type:'text', placeholder:'목록에서 찾기', oninput:e=>{ q=e.target.value.trim().toLowerCase(); page=1; draw(); }});
  const count = el('span',{class:'hint'});
  const tb = el('div',{class:'toolbar'}, search, count, el('span',{class:'grow'}),
    el('button',{class:'btn small', onclick:()=>{ getRows().unshift(newRow()); highlight=new Set([getRows()[0]]); q=''; search.value=''; page=1; markDirty(file); onChange&&onChange(); draw(); }}, '+ 한 줄 추가'));
  if(opts.toolbar) opts.toolbar.forEach(b=>tb.append(b));
  const wrap = el('div',{class:'tbl-wrap'});
  const pager = el('div',{class:'pager'});
  root.append(tb, wrap, pager);
  function filtered(){
    const rows = getRows();
    if(!q) return rows.map((r,i)=>[r,i]);
    return rows.map((r,i)=>[r,i]).filter(([r])=>(searchKeys||cols.map(c=>c.key)).some(k=>String(r[k]??'').toLowerCase().includes(q)));
  }
  function input(r, c){
    const set = v=>{ r[c.key]=v; markDirty(file); onChange&&onChange(r,c.key); };
    let e;
    if(c.type==='bool'){ e = el('input',{type:'checkbox', onchange:ev=>set(ev.target.checked)}); e.checked=!!r[c.key]; return el('div',{style:'text-align:center'},e); }
    if(c.type==='select'){ e = el('select',{onchange:ev=>set(ev.target.value)}, c.options.map(o=>el('option',{value:o}, o||'(없음)'))); e.value = r[c.key]||''; }
    else if(c.type==='num'){ e = el('input',{type:'number', min:0, oninput:ev=>set(ev.target.value===''?0:parseInt(ev.target.value,10)||0)}); e.value = r[c.key]??0; }
    else if(c.type==='long'){ e = el('textarea',{oninput:ev=>set(ev.target.value), onfocus:ev=>ev.target.style.height='90px', onblur:ev=>ev.target.style.height='30px'}); e.value = r[c.key]??''; }
    else { e = el('input',{type:'text', oninput:ev=>set(ev.target.value)}); e.value = r[c.key]??''; }
    if(c.width) e.style.width = c.width;
    return e;
  }
  function draw(){
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length/pageSize));
    if(page>pages) page=pages;
    const slice = list.slice((page-1)*pageSize, page*pageSize);
    count.textContent = `${list.length.toLocaleString()}건`;
    const table = el('table',{class:'ed'},
      el('thead',{}, el('tr',{}, cols.map(c=>el('th',{title:c.tip||''}, c.label)), el('th',{},''))),
      el('tbody',{}, slice.map(([r,i])=>el('tr',{class: highlight.has(r)?'hl':''},
        cols.map(c=>el('td',{}, input(r,c))),
        el('td',{}, el('button',{class:'btn small danger', onclick:()=>{ if(confirm(`"${r[cols[0].key]||r[cols[1].key]||''}" 줄을 삭제할까요?`)){ getRows().splice(getRows().indexOf(r),1); markDirty(file); onChange&&onChange(); draw(); } }},'삭제'))))));
    wrap.innerHTML=''; wrap.append(table);
    pager.innerHTML='';
    if(pages>1){
      pager.append(el('button',{class:'btn small', disabled:page<=1, onclick:()=>{page--; draw();}},'이전'),
        el('span',{}, `${page} / ${pages}`),
        el('button',{class:'btn small', disabled:page>=pages, onclick:()=>{page++; draw();}},'다음'));
    }
  }
  root.redraw = (hl)=>{ if(hl) highlight = hl; draw(); };
  draw();
  return root;
}

function pickFile(accept){
  return new Promise(res=>{
    const i = el('input',{type:'file', accept, style:'display:none', onchange:e=>{ res(e.target.files[0]||null); i.remove(); }});
    document.body.append(i); i.click();
  });
}
async function readSheet(file){
  if(typeof XLSX==='undefined') throw new Error('엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
}
function exportExcel(name, headers, rows){
  if(typeof XLSX==='undefined'){ toast('엑셀 기능을 불러오지 못했어요'); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '목록');
  XLSX.writeFile(wb, name);
}
// 머리글 이름으로 열 찾기 (aliases: {key:[이름들]})
function mapHeader(aoa, aliases, required){
  for(let r=0; r<Math.min(10, aoa.length); r++){
    const row = aoa[r].map(v=>String(v).trim());
    const idx = {};
    for(const k in aliases){ const j = row.findIndex(h=>aliases[k].includes(h)); if(j>=0) idx[k]=j; }
    if(required.every(k=>k in idx)) return {row:r, idx};
  }
  return null;
}

async function importList(key, aliases, required, done){
  const f = await pickFile('.xlsx,.xls,.csv'); if(!f) return;
  let aoa; try{ aoa = await readSheet(f); }catch(e){ showDialog('엑셀을 읽지 못했어요', '<p>'+esc(e.message)+'</p>'); return; }
  const m = mapHeader(aoa, aliases, required);
  if(!m){ showDialog('열 이름을 찾지 못했어요', '<p>엑셀 첫 줄의 열 이름을 확인해 주세요. 꼭 있어야 하는 열: <b>'+required.map(k=>aliases[k][0]).join(', ')+'</b></p>'); return; }
  const rows = aoa.slice(m.row+1).filter(r=>r.some(v=>String(v).trim()!=='')).map(r=>{
    const o = {}; for(const k in aliases) o[k] = k in m.idx ? String(r[m.idx[k]]).trim() : '';
    return o;
  });
  if(key==='readings') rows.forEach(r=>r.popular = ['true','1','o','ㅇ','y','★','인기'].includes(String(r.popular).toLowerCase()));
  const mode = await showDialog('불러오기 방식', `<p>엑셀에서 <b>${rows.length.toLocaleString()}줄</b>을 읽었어요. (찾은 열: ${Object.keys(m.idx).map(k=>aliases[k][0]).join(', ')})</p>
    <p><b>전체 바꾸기</b>: 지금 목록(${DATA[key].length.toLocaleString()}줄)을 지우고 엑셀 내용으로 바꿔요.<br><b>뒤에 추가</b>: 지금 목록은 두고 엑셀 내용을 덧붙여요.</p>`,
    [{label:'취소',value:null},{label:'뒤에 추가',value:'add'},{label:'전체 바꾸기',value:'replace',primary:true}]);
  if(!mode) return;
  if(mode==='replace') DATA[key].splice(0, DATA[key].length, ...rows); else DATA[key].push(...rows);
  markDirty(key); done(); toast(`${rows.length.toLocaleString()}줄을 반영했어요. 저장을 눌러야 사이트에 적용돼요.`, 4000);
}

async function importDLS(){
  const f = await pickFile('.xlsx,.xls,.csv'); if(!f) return;
  let aoa; try{ aoa = await readSheet(f); }catch(e){ showDialog('엑셀을 읽지 못했어요', '<p>'+esc(e.message)+'</p>'); return; }
  const m = mapHeader(aoa, {title:['자료명','서명','도서명'], status:['자료상태','상태'], author:['저자'], pub:['출판사'], year:['출판년도','발행년도']}, ['title','status']);
  if(!m){ showDialog('DLS 엑셀이 아닌 것 같아요', '<p>첫 줄에 <b>자료명</b>과 <b>자료상태</b> 열이 있어야 해요. DLS의 "리스트 반출" 파일인지 확인해 주세요.</p>'); return; }
  const agg = new Map();
  aoa.slice(m.row+1).forEach(r=>{
    const t = String(r[m.idx.title]||'').trim(); if(!t) return;
    const k = norm(t);
    if(!agg.has(k)) agg.set(k, {title:t, author:m.idx.author!=null?String(r[m.idx.author]).trim():'', pub:m.idx.pub!=null?String(r[m.idx.pub]).trim():'', year:m.idx.year!=null?String(r[m.idx.year]).trim():'', st:{}});
    const st = String(r[m.idx.status]||'').trim();
    const a = agg.get(k); a.st[st] = (a.st[st]||0)+1;
  });
  const books = DATA.onchaek.books;
  const used = new Set(), updated = [], added = [], missing = [], arrived = [];
  const findKey = t => { const k = norm(t); if(agg.has(k)) return k; for(const kk of agg.keys()){ if(kk.length>2 && k.length>2 && (k.startsWith(kk)||kk.startsWith(k))) return kk; } return null; };
  books.forEach(b=>{
    const k = findKey(b.title);
    if(!k || used.has(k)){ if((b.reg||0)>0 || !(b.unreg>0)) missing.push(b); return; }
    used.add(k);
    const a = agg.get(k), st = a.st;
    const total = Object.values(st).reduce((x,y)=>x+y,0);
    const before = `${b.reg||0}권(가능 ${b.avail||0})`;
    b.reg = total; b.avail = st['대출가능']||0; b.out = st['대출중']||0; b.lost = st['소재불명']||0;
    b.damaged = (st['가치상실']||0) + (st['파손']||0) + (st['폐기']||0);
    if(!b.author) b.author = a.author; if(!b.pub) b.pub = a.pub; if(!b.year) b.year = a.year;
    if((b.planned||0)>0 && total>0){ arrived.push(b.title); b.planned = 0; }
    const after = `${b.reg}권(가능 ${b.avail})`;
    if(before!==after) updated.push(`${b.title}: ${before} → ${after}`);
  });
  for(const [k,a] of agg){
    if(used.has(k)) continue;
    const st = a.st, total = Object.values(st).reduce((x,y)=>x+y,0);
    const nb = {title:a.title, author:a.author, pub:a.pub, year:a.year, reg:total, unreg:0, avail:st['대출가능']||0, out:st['대출중']||0, lost:st['소재불명']||0,
      damaged:(st['가치상실']||0)+(st['파손']||0)+(st['폐기']||0), planned:0, lecStatus:'', lecDetail:'', lecPath:'', lecAltBooks:'', lecAltPub:'', lecProgress:'', lecNote:'', readable:false, memo:''};
    books.push(nb); added.push(nb);
  }
  DATA.onchaek.dlsDate = today();
  markDirty('onchaek');
  renderOnchaek();
  renderOnchaek.editor.redraw(new Set([...added, ...missing]));
  const li = a => a.length ? '<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>' : '<p class="hint">없음</p>';
  showDialog('DLS 자료를 반영했어요', `
    <p>엑셀에서 <b>${agg.size}종</b>을 읽었어요. DLS 기준일을 오늘로 바꿨어요.</p>
    <h4>권수가 바뀐 책 (${updated.length})</h4>${li(updated)}
    ${arrived.length?`<h4>구매예정 → 입고 처리 (${arrived.length})</h4>${li(arrived)}`:''}
    <h4>새로 추가된 책 (${added.length}) — 노란색 줄</h4>${li(added.map(b=>b.title))}
    <p class="hint">새 책은 작가 강연·낭독극 정보를 직접 채워 주세요. 온책읽기 도서가 아니면 삭제하세요.</p>
    <h4>엑셀에 없는 책 (${missing.length}) — 노란색 줄</h4>${li(missing.map(b=>b.title))}
    <p class="hint">미등록 도서면 그대로 두고 <b>미등록</b> 칸에 권수를 넣으세요. 목록에서 뺄 책이면 삭제하세요.</p>
    <p><b>확인한 뒤 💾 저장을 눌러야 사이트에 반영돼요.</b></p>`);
}

  window.open('index.html', '_blank');
});
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); save(); } });

(async function init(){
  if(!window.SITE){
    document.getElementById('globalNote').innerHTML = '<div class="note warn">데이터 파일을 찾지 못했어요. 사이트 폴더 안의 <code>admin.html</code>을 열었는지 확인하거나, <b>📁 사이트 폴더 연결</b>을 눌러 주세요.</div>';
  }
  if(!HAS_FS){
    document.getElementById('globalNote').innerHTML += '<div class="note">이 브라우저에서는 폴더에 바로 저장할 수 없어요. <b>크롬이나 엣지</b>로 열면 편해요. (지금은 저장하면 파일이 내려받아져요)</div>';
  }
  renderAll(); updateStatus();
  // 이전에 연결한 폴더가 있으면 권한만 확인
  if(HAS_FS){
    const saved = await idbGet('dir');
    if(saved && (await saved.queryPermission({mode:'readwrite'}))==='granted') await useFolder(saved, true);
    else if(saved) document.getElementById('status').innerHTML += ` · 이전 폴더(<b>${esc(saved.name)}</b>)를 쓰려면 📁 버튼을 누르세요`;
  }
})();
</script>
</body>
</html>
